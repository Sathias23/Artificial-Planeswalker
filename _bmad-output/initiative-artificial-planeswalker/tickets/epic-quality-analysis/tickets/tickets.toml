[[entry]]
id = 3
type = "story"
title = "Synergy detection sees every card that should count, and scores it monotonically and in order"
description = "Pins a strong-strength detection and replaces the `len(...) >= 0` lifelink assertion, then reads multi-face text from card_faces, parses tribal types properly (\"Elves\", Kindred; option a, option b deferred), finds keyword holders past the first line, makes tribal payoffs independent of deck order without counting lords twice, and requires both halves of a mechanic combo. Today every multi-face card is invisible to synergy detection, and one-sided mechanic combos are reported. Merged from story 7.4, was 35 (board review 2026-11-09): asserts cohesion `high`, then makes cohesion rise with coverage (option a), states the strength tiering once instead of five times, and sorts the synergy output so it is identical across processes. Today cohesion can fall as coverage rises, and the output order changes between processes."
verify = "detect_synergies on a fixture deck with an MDFC payoff, an Elf lord, a second-line keyword holder and a one-sided mechanic finds the first three, rejects the fourth, and returns the same result for the deck in reverse order; two processes with different PYTHONHASHSEED return byte-identical detect_synergies output, and adding coverage to a fixture deck never lowers its cohesion."
covers = ["R15"]
after = ["5.1"]
hitl = false
risk = "medium"
findings = ["B4-P8", "B4-P9", "M23", "B4-D3", "B4-P3", "B4-P4", "B4-P6", "B4-P7", "B4-D4", "B4-P14", "B4-P15"]
width = "src/logic/synergy.py and tests/unit/logic/test_synergy.py"
references = ["review — _bmad-output/initiative-artificial-planeswalker/review-codebase-2026-11/review-codebase-2026-11.md, Summary, Q15; the `## Code Review` stamps (and Merged findings rows for M-groups) for B4-P8, B4-P9, M23, B4-D3, B4-P3, B4-P4, B4-P6; and Q15's B4-P7, B4-D4, B4-P14, B4-P15"]

