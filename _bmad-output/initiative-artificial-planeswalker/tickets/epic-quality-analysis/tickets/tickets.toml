[[entry]]
id = 1
type = "story"
title = "Snow basics and restricted cards get the right verdict"
description = "Checks _KNOWN_FORMATS against the real legality keys, exempts snow basics from the copy limit, and treats a restricted card as legal at one copy and a violation above it (option a: new wording and possibly a new rule token through CHECK_FOR_RULE, the OpenAPI contract and the skill). Today five or more snow basics make a deck illegal, and one restricted card makes a legal Vintage deck read illegal on the tool and on the companion panel. Handoff: epic-quick-wins entry 4 (1.4) reports legality coverage on top of this rule and waits on it, so its Vintage report lists no restricted line."
verify = "Through validate_deck and the companion format-check route, a deck with ten Snow-Covered Forests is legal, one Black Lotus in Vintage is legal and two are a violation, and a test fails when a real legality key is missing from _KNOWN_FORMATS."
covers = ["R15"]
after = ["4.2"]
hitl = false
risk = "medium"
plan_checkpoint = true
findings = ["B4-P12", "M2", "B4-D1"]
width = "src/logic/deck_validator.py, the format-check route's CHECK_FOR_RULE mapping, the format-legality skill, then npm run gen:api"
references = ["review — _bmad-output/initiative-artificial-planeswalker/review-codebase-2026-11/review-codebase-2026-11.md, Summary, Q15; the `## Code Review` stamps (and Merged findings rows for M-groups) for B4-P12, M2, B4-D1", "research — _bmad-output/initiative-artificial-planeswalker/research-codebase-architecture/research-codebase-architecture.md, the findings its merge groups cite"]

