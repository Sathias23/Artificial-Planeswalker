[[entry]]
id = 7
type = "story"
title = "Deck and connection recovery never leave silent stale state"
description = "Pins the CAP-3 probe re-arm, the socket's finally and the poller's unreachable reset, then defers deck_changed while a boot is unsettled, routes a refetch's transient refusal through the existing CAP-3 probe (no timer, AD-12; option a), resets the socket backoff only after a minimum open time, and keeps the format-check panel's last result while an agent edit refetches. Today an accept-then-drop backend reconnects every 2 s forever (about six requests a cycle) and the Disconnected panel never shows, a transient refusal on a refetch leaves the deck stale with no marker, and every agent edit blanks the format-check panel."
verify = "In vitest, an open-then-close socket loop reaches 'down' and backs off; a deck_changed during boot paints the in-flight response; a refetch refusal followed by a healthy probe refetches; the format-check panel keeps its rows through an agent edit."
covers = ["R19"]
after = [6]
hitl = false
risk = "high"
findings = ["F2-P3", "F1-P4", "M38", "F2-D1", "M40", "M39"]
width = "ui/src/state/deck.ts, socket.ts, poller.ts, formatCheck.ts, App.tsx and their tests"
