# epic-quality-companion-backend: one entry per story, in build order. Moved from epic-codebase-quality-pass at the 2026-11-09 board review.
# `covers` names this epic's Requirements ids (R<n> is review theme Q<n>). Keys beyond the template, ignored by tickets.py: `findings` (review finding ids) and `width`.

[[entry]]
id = 1
type = "story"
title = "Card images touch the database only on a cache miss"
description = "Skips the readiness probe and releases the session before the pacer wait on the image route, guards is_fetchable's port parse, enforces the 16 MB ceiling on wire bytes while streaming and before reading a cached file, keeps cache-path containment in the types the signatures carry, replaces before unlinking displaced siblings, and corrects the fetch-gate comment. Today every image request runs a four-SELECT probe and holds a pooled connection through the pacer wait, an unparseable image port escapes as a 500, and a compressed body can expand past the ceiling."
verify = "Through the image route, a cached image is served with no database statement, an uncached one holds no session during the pacer wait, a URL with a bad port answers the placeholder, and a compressed body that expands past 16 MB is cut off at the ceiling."
covers = ["R18"]
after = ["4.2", "4.4"]
hitl = false
risk = "medium"
findings = ["M7", "B12-P1", "B12-P3", "B12-P4", "B12-P5", "B12-P6", "B11-P10"]
width = "src/companion/app/images.py, deps.py, routes/cards.py and their tests"
references = ["review — _bmad-output/initiative-artificial-planeswalker/review-codebase-2026-11/review-codebase-2026-11.md, Summary, Q18; the `## Code Review` stamps (and Merged findings rows for M-groups) for M7, B12-P1, B12-P3, B12-P4, B12-P5, B12-P6, B11-P10", "research — _bmad-output/initiative-artificial-planeswalker/research-codebase-architecture/research-codebase-architecture.md, the findings its merge groups cite"]

[[entry]]
id = 2
type = "story"
title = "Backend errors log safely and name the real failure"
