[[entry]]
id = 1
type = "story"
title = "Database engine and model conventions hold as AGENTS.md states them"
description = "Pins the connect-time metadata repair where it can go wrong, the corrupt-file guarantee through the engine on every hook, and the `# noqa: F401` model imports, then sets DeckCardModel.deck and .card to lazy=\"raise\" (option a) with AGENTS.md and the two comments reworded to 'collections noload, scalar relations raise', drops the no-op autocommit kwarg and its test, logs a broken logfire install instead of passing, and states the import_state SQL once. Today the two scalar relations lazy-select (MissingGreenlet on a missed eager load) while AGENTS.md says noload, and a dropped model import passes every test."
verify = "Removing one `# noqa: F401` model import fails a test; a corrupt file connects through create_engine and only warns on every hook; reading DeckCardModel.card without selectinload raises at the access."
covers = ["R12"]
after = ["4.2", "5.1", "5.2", "4.5", "5.8"]
hitl = false
risk = "medium"
findings = ["B1-P1", "T1-1-P4", "T1-1-P5", "M12", "M43", "B1-P5", "B1-P6"]
width = "src/data/database.py, src/data/import_state.py, src/data/models/deck_card.py, the two noload comments in src/data/repositories/deck.py, their tests, AGENTS.md"
references = ["review — _bmad-output/initiative-artificial-planeswalker/review-codebase-2026-11/review-codebase-2026-11.md, Summary, Q12; the `## Code Review` stamps (and Merged findings rows for M-groups) for B1-P1, T1-1-P4, T1-1-P5, M12, M43, B1-P5, B1-P6", "research — _bmad-output/initiative-artificial-planeswalker/research-codebase-architecture/research-codebase-architecture.md, the findings its merge groups cite"]

