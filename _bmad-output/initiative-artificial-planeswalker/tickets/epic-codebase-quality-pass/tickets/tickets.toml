# epic-codebase-quality-pass: the 2026-11 codebase review's fix list, one entry per story, in build order.
# `covers` names the epic's Requirements line (R<n> is review theme Q<n>). Three keys beyond the template, ignored by tickets.py:
# `findings` lists the review finding ids the story resolves (each of the 385 fix findings is in exactly one entry; M<n> is a merge group),
# `width` is how wide the change is. `pull` copies `references`, which repeat the finding ids, into the story file.

