[[entry]]
id = 65
type = "story"
title = "Pre-commit and CI run the locked toolchain, match what users run, and their guards can go red"
description = "Per D10, the ruff and mypy hooks become language: system hooks running uv run (pass_filenames: false), additional_dependencies and its AGENTS.md sentence go, and a github-actions dependabot.yml is added; per D11, no-local-machine-paths matches any Windows user-profile path or project slug case-insensitively, the three tracked files are cleaned or excluded, and quality runs the hook on every push. Today the hooks and CI can disagree (fastembed is already missing from the hook list), and the leak guard watches only the old username. Merged from story 67 (board review 2026-11-09): commits a .python-version (3.12) that build_plugin.py copies into plugin/server/ (option b), raises the Node floor to >=22.13.0 with node-version, @types/node and the jest-dom pin moved together (option a), makes the live-contract canary fail on 4xx, 5xx and non-JSON answers and keeps its schedule from switching itself off, drops the 3.13 leg's repeated steps, skips the full CI on docs-only pushes (never on a required check, so no PR waits on a check that cannot report), gives the ui/tests .tsx file a tsconfig, and corrects the stale CI comments and CONTRIBUTING's gate list. Today the canary goes green on a 5xx, plugin users may run an untested Python, and docs-only pushes run the Windows job. The leak-guard check runs in its own small job with no paths filter, so the docs-only skip never skips it (docs-only commits are where the three leaked paths were found)."
verify = "`pre-commit run --all-files` passes on the uv.lock toolchain; a planted user-profile path under another username fails the hook locally and in the quality job; the canary against a stub answering 500 fails; a docs-only push skips the code jobs; plugin/server/ carries .python-version; `npm run typecheck` covers the ui/tests .tsx file."
covers = ["R24"]
after = [1, 4, 68]
hitl = false
risk = "low"
findings = ["T2-D1", "T2-D2", "T2-D5", "T2-D6", "T2-P1", "T2-P2", "T2-P4", "T2-P6", "T2-P9", "T2-P10", "T2-P11"]
width = ".pre-commit-config.yaml, .github/workflows/ci.yml and live-contract.yml, .github/dependabot.yml, .python-version, scripts/build_plugin.py, ui/package.json, the tsconfigs, AGENTS.md, CONTRIBUTING.md, three tracked files with user-profile paths; plugin rebuild"
references = ["review — _bmad-output/initiative-artificial-planeswalker/review-codebase-2026-11/review-codebase-2026-11.md, Summary, Q24; the `## Code Review` stamps (and Merged findings rows for M-groups) for T2-D1, T2-D2; and Q24's T2-D5, T2-D6, T2-P1, T2-P2, T2-P4, T2-P6, T2-P9, T2-P10, T2-P11"]

