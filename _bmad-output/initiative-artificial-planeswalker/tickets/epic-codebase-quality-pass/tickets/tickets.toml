[[entry]]
id = 1
type = "story"
title = "No repo command can destroy or miss the operator's database"
description = "Makes the import CLI, the Spellbook CLI and the startup diagnostics honour CARDS_DATABASE_URL, stops cdp_harness from touching or passing through a live database, corrects the two migration docstrings' oracle_cards advice and stops the plugin launch installing the dev toolchain. Today `cdp_harness.py panels --data-dir <live dir>` deletes cards.db and every saved deck, and a refresh with CARDS_DATABASE_URL set writes a file the server never reads."
verify = "With CARDS_DATABASE_URL pointing at a temp file, the import CLI, the Spellbook CLI and the startup diagnostics all name and write that file; `cdp_harness.py panels --data-dir` on a directory holding a cards.db leaves it byte-identical; the rebuilt plugin's launch config syncs no dev group."
covers = ["R1"]
after = []
hitl = false
risk = "medium"
findings = ["M21", "B13-P1", "B13-P5", "B13-P10", "B13-P11"]
