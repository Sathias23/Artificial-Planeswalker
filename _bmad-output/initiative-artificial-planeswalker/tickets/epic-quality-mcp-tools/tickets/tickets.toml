[[entry]]
id = 6
type = "story"
title = "One indexed, bounded card-name resolver"
description = "Pins printed-name matching, lookup_card's cap, blank-name guard and games pass-through, and find_similar's seed resolution, then routes lookup, deck management, import and find_similar through one resolver that uses the NOCASE index, caps the partial read at the match limit plus one and says \"more than N\" (option b), escapes LIKE wildcards in user text, and shares the wording remove_card_from_deck copies. Today three resolvers order candidates differently, find_similar's exact match is a full scan (58 ms against 0.5 ms in #108), and a two-letter query materialises thousands of rows and reports the capped count as exact. Handoff: epic-reliable-deck-workflows entry 1 (2.1) builds consistent playable-name resolution on this resolver and waits on it."
verify = "Through the tool entry points, a printed-name lookup resolves on every tool, a two-letter partial query reads at most the cap plus one rows and says \"more than N\", `50%` matches literally, and EXPLAIN QUERY PLAN for find_similar's seed match uses the NOCASE index."
covers = ["R9"]
after = [2]
hitl = false
risk = "medium"
findings = ["B2-P5", "B9-P14", "B9-P16", "M4", "M51", "M3", "B2-P7"]
width = "src/data/repositories/card.py and deck.py, src/mcp_server/tools/{card_lookup,deck_management,deck_import,find_similar}.py"
references = ["review — _bmad-output/initiative-artificial-planeswalker/review-codebase-2026-11/review-codebase-2026-11.md, Summary, Q9; the `## Code Review` stamps (and Merged findings rows for M-groups) for B2-P5, B9-P14, B9-P16, M4, M51, M3, B2-P7", "research — _bmad-output/initiative-artificial-planeswalker/research-codebase-architecture/research-codebase-architecture.md, the findings its merge groups cite"]

