# epic-quality-mcp-tools: one entry per story, in build order. Moved from epic-codebase-quality-pass at the 2026-11-09 board review.
# `covers` names this epic's Requirements ids (R<n> is review theme Q<n>). Keys beyond the template, ignored by tickets.py: `findings` (review finding ids) and `width`.

[[entry]]
id = 1
type = "story"
title = "Unused backend surface is deleted"
description = "Deletes merge_decks, find_deck_by_name, update_deck_color_identity, the unused combo meta readers, the three script-only search methods and the script that is their only caller, the dead single-card validator, about 350 lines of unreachable curve feedback, health_check's sentinel-card write, the dead src/data re-exports, migrate_add_card_vec.py, verify_image_data.py and pytest-cov, with the tests that cover only them. Today that code carries latent bugs (a non-atomic merge, a second copy-limit rule that disagrees with the live one, a fake card written into cards) and is reviewed and kept in step like live code. migrate_add_card_vec.py goes with no test of its own; 4.68's migration tests skip it."
verify = "The full Python gate passes, a grep finds no reference to any deleted name in src/, scripts/, docs/ or the five skills, and `uv run python -m scripts.build_plugin` leaves plugin/ in step."
covers = ["R5"]
after = ["4.2", 2, 6, "7.1", "7.5"]
hitl = false
risk = "medium"
findings = ["M13", "M14", "B4-D6", "B4-P17", "B1-D2", "B1-P8", "B13-P20", "B13-P21", "T2-P12"]
width = "src/data/repositories/{deck,card,combo_snapshot}.py, src/logic/{deck_validator,mana_curve}.py, src/data/database.py, src/data/__init__.py, three scripts, pyproject.toml, the tests that cover only deleted code"
references = ["review — _bmad-output/initiative-artificial-planeswalker/review-codebase-2026-11/review-codebase-2026-11.md, Summary, Q5; the `## Code Review` stamps (and Merged findings rows for M-groups) for M13, M14, B4-D6, B4-P17, B1-D2, B1-P8, B13-P20, B13-P21, T2-P12", "research — _bmad-output/initiative-artificial-planeswalker/research-codebase-architecture/research-codebase-architecture.md, the findings its merge groups cite"]

[[entry]]
id = 2
type = "story"
title = "Every tool answers infrastructure failures as a status"
description = "Pins the untested DatabaseError and database_not_initialized arms and set_active_deck's session release, then puts the readiness probe, connection and embedder setup and the card tools' pre-reads inside one shared guard, so a locked or corrupt file, a missing sqlite-vec extension or an offline first model load answers status=\"error\" (a new `error` token on the two semantic result models); semantic_search_cards loads the embedder after the database and index guards, initialize_database's error names the real cause, and add_card_to_deck stops reporting every IntegrityError as `exists`. Today those failures reach the agent as an MCP isError, and in compare_deck_power a failure on side A means side B never runs."
verify = "With a corrupt cards.db, a locked file, a missing vec extension and an offline model load injected in turn, every MCP tool answers a status through its real entry point and none raises."
covers = ["R7"]
after = ["4.2", "1.4", "1.5"]
hitl = false
risk = "high"
plan_checkpoint = true
findings = ["B8-P4", "B8-P6", "B9-P18", "T1-2-P5", "M19", "B7-P1", "B7-P12", "B8-P7"]
width = "src/mcp_server/tools/ (deck_management, deck_analysis, assess and compare, semantic_search, find_similar, build_search_index, companion, and view_deck's failure path only), server.py, the readiness probe in src/data/database.py; about 18 call sites"
references = ["review — _bmad-output/initiative-artificial-planeswalker/review-codebase-2026-11/review-codebase-2026-11.md, Summary, Q7; the `## Code Review` stamps (and Merged findings rows for M-groups) for B8-P4, B8-P6, B9-P18, T1-2-P5, M19, B7-P1, B7-P12, B8-P7"]

[[entry]]
id = 3
type = "story"
title = "A failed combo read degrades instead of scoring zero"
description = "Drives the combo-provisioning rollback in a test, then makes an OperationalError after a good availability probe surface as combo data unavailable (AD-6's degradation path, no new vocabulary) instead of an empty variant list. Today a locked database mid-assessment scores combo_potential 0 at high confidence with no combo_data_unavailable reason."
verify = "An injected OperationalError on the variant read makes assess_deck_power report combo_data_unavailable with reduced confidence, and the rollback test drives the provisioning failure path."
covers = ["R7"]
after = [2]
hitl = false
risk = "medium"
findings = ["B9-P12", "B9-D1"]
width = "src/data/repositories/combo_snapshot.py, src/mcp_server/tools/assess_deck_power.py and compare_deck_power.py"
references = ["review — _bmad-output/initiative-artificial-planeswalker/review-codebase-2026-11/review-codebase-2026-11.md, Summary, Q7; the `## Code Review` stamps (and Merged findings rows for M-groups) for B9-P12, B9-D1"]

[[entry]]
id = 4
type = "story"
title = "Card search inputs mean the same thing in every tool"
description = "Pins search_cards' normalisation and pass-throughs and the two-game platform rule, then adds one normaliser per parameter kind at the tool edge: the format key case-folded before it enters the JSON path, games stripped before use, names stripped in lookup_card_by_name, one copy of the search vocabularies and mana bounds, and `invalid` for an unknown lookup platform (CardLookupResult gains the token) and for a page whose offset cannot be bound. Today format=\"Standard\" matches nothing on four search paths, games=[\" arena\"] marks every card unavailable, and a huge page escapes as an OverflowError."
verify = "Through the tool entry points, \"Standard\" and \"standard\" return the same cards on every search tool, \" arena\" behaves as \"arena\", an unknown platform answers invalid on lookup_card_by_name, and page=2**62 answers invalid."
covers = ["R8"]
after = [2, "7.1", 6, "6.11"]
hitl = false
risk = "medium"
plan_checkpoint = true
findings = ["B4-P11", "B9-P15", "M16", "M18", "M5", "M49", "B9-D3", "B9-P8"]
width = "src/data/repositories/card.py, src/search/query.py, src/mcp_server/tools/{card_lookup,card_search,semantic_search,find_similar,deck_analysis}.py, src/logic/deck_validator.py, a shared normaliser module"
references = ["review — _bmad-output/initiative-artificial-planeswalker/review-codebase-2026-11/review-codebase-2026-11.md, Summary, Q8; the `## Code Review` stamps (and Merged findings rows for M-groups) for B4-P11, B9-P15, M16, M18, M5, M49, B9-D3, B9-P8", "research — _bmad-output/initiative-artificial-planeswalker/research-codebase-architecture/research-codebase-architecture.md, the findings its merge groups cite"]

[[entry]]
id = 5
type = "story"
title = "Deck tool inputs are normalised the same way"
description = "Strips deck_id in load_deck, delete_deck and set_active_deck, normalises create_deck's format and metadata the way update_deck does, answers `invalid` for commander=True with sideboard=True, and leaves About metadata lines out of the 250-line import pre-count. Today a padded deck id works for add and update but not for load, delete or set_active_deck, a deck created as \"Commander\" never lists under commander, and a sideboard commander is stored though the assessment ignores it."
