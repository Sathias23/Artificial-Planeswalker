type = "story"
title = "Arena imports keep mixed printings and show every line status"
description = "Pins the import's per-line quantity < 1 and > 250 branches, then sums the lines of one card printed twice in one Arena export and checks the sum against the quantity cap, keeping `exists` only for rows already in the deck (option a, a tool behaviour change), and stops _line_result hiding unexpected statuses. Today an Arena export with mixed-art basics imports short, its second printing answered `exists`, and the deck comes back `partial`. Handoff: epic-reliable-deck-workflows entry 4 (2.4) writes the import's duplicate-line rules on top of this fix and waits on it."
verify = "Through import_decklist, an Arena export with `2 Island (ELD) 250` and `2 Island (THB) 251` imports 4 Islands, lines summing past 250 are refused, and a line with an unexpected status is reported as such."
covers = ["R10"]
