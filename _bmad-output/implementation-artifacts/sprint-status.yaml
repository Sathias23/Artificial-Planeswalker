 proposes as the spacing, with a cap of 4 that never binds at normal latency and binds hard on a degraded CDN (throughput = min(1/S, N/L); 99 x max(S, L/N) = 9.9 s at S=0.1/N=4/L=0.2, and 49.5 s with 4 sockets rather than 9.9 s with ~20 at L=2.0). RECORDED SO IT IS CHOSEN KNOWINGLY, NOT COPIED: Scryfall's 10 req/s guidance covers api.scryfall.com and the *.scryfall.io FILE ORIGINS THIS ROUTE FETCHES FROM ARE EXPLICITLY EXEMPT — so AD-11's pacer is a good-citizen and NFR-05 budget decision, NOT compliance, and AC 3 requires the constants' docstrings to say so (a constant justified by a rule that does not apply is c3-4's prose-outruns-code finding pre-committed). THE LANDMINE NOBODY WOULD HAVE PREDICTED (Q6): the DB pool is a second, invisible choke point — create_engine takes SQLAlchemy's defaults, MEASURED AsyncAdaptedQueuePool size 5 + overflow 10 = 15 connections with a 30 s pool_timeout, and FastAPI runs a yield-dependency's teardown AFTER the endpoint returns, so the route's DbSession is held ACROSS the pacer wait (a claim Task 0 must prove, not inherit). At the proposed constants a 99-tile burst drains in ~9.9 s, comfortably inside 30 s — it works BY ARITHMETIC, not by design, and a slower pacer would produce sqlalchemy.exc.TimeoutError, which is NOT a DatabaseError and would surface as 500 internal_error rather than 503. Q6 proposes accept+pin+ledger on c4-1 (which already carries this route's whole-row-read entry) over restructuring the one route away from DbSession. OTHER FORKS: Q1 (a Pacer in images.py created in the lifespan beside image_client and passed to fetch_image as a REQUIRED parameter, so no signature fetches without pacing — module-level singleton rejected on deps.Database's own shipped ruling against globals that "serialise unrelated apps in a test run"; transport-level rejected by build_image_client's shipped sentence "this is not the pacer and must not grow into one"); Q4 (the queue wait sits OUTSIDE _FETCH_TOTAL_SECONDS, no queue ceiling in MVP, and the wire says NOTHING — the ~10 s figure goes in ui/README.md's blind-spot section where c4-4 will look, not into a wire description that would repeat c3-2's "a true count read as a false rule"); Q5 (in-flight coalescing DECLINED — it is a cache behaviour and c3-7 owns it; measured cost today is ZERO extra fetches on both 98/99-id decks because duplicate printings collapse in deck_cards, with c6-4's suggestion rows named as the trigger that would change the answer). Five mutation probes specified, two of them shaped by c3-5's review theme (a semaphore acquired after the request, or spacing computed from completion times, paces nothing while reading exactly like it does). Baseline to re-measure: Python 2275 full / 2240 under -m "not integration", frontend 568; 7 paths / 12 components; toolchain Python 3.12.13, FastAPI 0.140.0, Starlette 0.48.0, SQLAlchemy 2.0.44, httpx 0.28.1, uvicorn 0.51.0.
  c3-7-sharded-atomically-written-disk-cache: done  # REVIEWED -> done 2026-08-01 — three-layer review complete: 1 decision (D1: Content-Type wins over the URL suffix in cache_extension, so warm/cold media types agree by construction) + 13 patches applied same day (headlines: the one-write-site scan was blind to Path.replace and to a rebound local — the two spellings the retired ban DID catch — and its quiet-direction test PINNED the rebound local as sanctioned; the to_thread reachability gate's non-vacuity check was a substring over prose, satisfied by comments after every real call is deleted; both scanners extended and re-planted. Plus: warm read gains the fetch path's _MAX_IMAGE_BYTES ceiling; cache failures above the file layer (to_thread RuntimeError) now degrade instead of 500ing; a rewrite under the other extension displaces the stale sibling that would shadow it forever; AC 3's refreshed-row staleness measured END TO END rather than true-by-signature; the three-card png pin parametrized over all three; the same-key concurrent write race regained a route-level reproduction through the real filesystem; the burst seeder deduped; five ledger entries added and the ui/README blind-spot row for c4-4). 4 dismissed as noise. Suites 2386 -> 2395 passed / 123.40 s, frontend 568 unchanged, all gates green, gen:api/gen:types NO DIFF, plugin mirror rebuilt byte-identical. Next = PR into feat/companion-c3.  # IMPLEMENTED -> review 2026-08-01 off 2927336 — the sharded, atomically written disk cache, and the FIRST write path in src/companion. All six open questions "as proposed" (18 of 18 running); Brad also ruled c3-6's standing open decision (`4` stays out of c3-3's deck-limit family; FETCH_CONCURRENCY keeps its name; this story touched neither). SHIPPED: images.DiskCache — AD-11's `data_dir()/image_cache/<id[0:2]>/<id>/<size>_<face>.<ext>` path, the extension taken from the resolved URL or the Content-Type and NEVER from the size key, temp+os.replace with deliberately NO