  c5-8-the-one-real-socket-integration-test: done  # MERGED via PR #60 into feat/companion-c5 at `057a6d9` (2026-08-09). Greptile caught two real findings after the PR was raised: P1 (`ui/tests/devProxyRoundTrip.test.ts`) — the vitest port counter tracked the port a server was REQUESTED at, not the one Vite actually bound; a retry that moved a server to a higher port left the counter one behind, so the next test could be handed out that still-live server's real port, deterministically tripping recordOrigin()'s distinctness assertion once the collision resolved. Fixed by reseeding the counter past the actually-bound port after every listen(). P2 (`test_live_backend.py`) — this review's OWN patch (below) had added `assert record_two.port != record_one.port`; Greptile correctly flagged that as wrong, since the OS can legally reissue the same ephemeral port to backend_two on a healthy restart once backend_one's listening socket closes. Reverted, with a comment recording why the assertion doesn't belong there. Re-verified: integration test green, devProxyRoundTrip green (9 tests), full frontend suite 1,868/69 unchanged, Python 2,770/1 skipped unchanged, CI green, merged. **Epic 5 ("The Agent's Channel") is now COMPLETE.** Next: the C5 retro, then a post-retro integration PR from feat/companion-c5 into master (no Greptile, per standing rule). PREVIOUSLY — CODE-REVIEWED 2026-08-09 -> done. Three layers (Blind Hunter, Edge Case Hunter, Acceptance Auditor) against the staged diff on `feat/companion-c5-8-live-backend`. 0 decision-needed, 5 patch applied, 0 defer, ~16 dismissed as noise. PATCHES: the `backends` fixture's teardown now raises an `ExceptionGroup` instead of silently dropping every backend-stop failure but the first (contradicted AC 10's "explicit and total" claim); the four `websockets.connect()`/`.close()` calls now carry explicit `open_timeout`/`close_timeout`, matching the module's own "every await carries a bound" comment which three reviewers independently c