  c3-6-paced-concurrency-capped-cdn-fetching-at-one-global-choke-point: done  # IMPLEMENTED 2026-08-01 off 4765bc6 — the image pacer, and the first story in this feature whose deliverable is a RATE. All six open questions "as proposed" (17 of 17 running). SHIPPED: images.Pacer — one asyncio.Semaphore (FETCH_CONCURRENCY = 4, the cap) plus a turnstile-guarded start-spacing cursor (FETCH_SPACING_SECONDS = 0.1, the rate), constructed ONCE in the lifespan beside image_client and passed to fetch_image as a REQUIRED parameter, so AC 1 is structural: there is no signature that fetches unpaced. No new dependency, no new reason token, no new route, no router edit, no build_app() change, and NO WIRE CHANGE AT ALL. THE HEADLINE MEASUREMENT: `npm run gen:api` produced NO DIFF — neither generated file appears in `git status --porcelain`, 7 paths / 12 components byte-identical — which CONFIRMS dump_openapi.py:29-30's forward-dated prediction by running the generator rather than arguing it; the docstring is now restated as shipped with c3-7 named next. THE DETERMINISM WORKED AND IS THE STORY'S REAL DELIVERABLE: Q3's injected clock+sleep means 40-odd existing fetch tests now traverse the pacer and the suite got FASTER — 2286 passed/149.60s -> 2325 passed/147.77s, +39 tests and 1.8s LESS wall clock, because Q1's per-app pacer gives every test a cold first fetch and no cross-test timing debt. Nothing in the suite sleeps to prove a rate. SIX MUTATION PROBES, AND TWO OF THEM FOUND SOMETHING RATHER THAN CONFIRMING SOMETHING. Probe (f) — spacing computed from COMPLETIONS instead of STARTS — PASSED ALL 75 UNIT TESTS: a mocked fetch is instantaneous, so completion time and start time coincide and nothing in the suite could distinguish the two designs, while in production completion-based spacing serialises exactly when the CDN slows down (c3-5's review theme in this story's costume — a check that reads correct and measures the wrong moment). Closed by a test that drives four fetches against