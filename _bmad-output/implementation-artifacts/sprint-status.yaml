ers"; (4) two PRE-EXISTING structural pins broke and both were right to break — test_errors.py asserted every 200 body is exactly {"$ref"}, which a bare array is not, so it was replaced by a family-keyed _is_ref_rooted() (an array OF an inline envelope is still refused) with its own six-case firing/silent table; and test_spa.py's two schema tests hardcoded {"/health"}, repaired to their actual claims so they no longer rot when a story adds a route; (5) one forward-dated comment BECAME TRUE on its own (StatePanel's index-keys rationale — deck names really are non-unique user-authored strings) and was left unedited, which AC 20 permits. SIX MUTATION PROBES, ALL SIX CAUGHT, every mutation verified on disk before the verdict and every revert after: the load-bearing ones are probe 1 (the router silently unregistered — c2-9's headline defect in this story's shape, 19 failed), probe 2b (model_validate's silent-zero counts on the LIST route, the half probe 2 left untouched — "assert 0 == 3", which is landmine 10's exact failure mode), and probe 3+3b (a wrong path spelling is caught by the drift gate if you don't regenerate and by the path assertion if you do — neither test alone suffices). Probe 5 found a DECLARED LIMIT rather than a hole: a companion-local duplicate shape is invisible to AC 8 until something SERVES it. AC 16's anchors: initially withheld (edit-the-forbidden-file reasoning), then review R7 overturned that — the file already carries a HealthResponse anchor of exactly that kind — so two toContain anchors were added; the derived ban mechanism is untouched (AC 16's mechanism horn over its literal no-edit clause). AC 21's blind-spot map shipped in ui/README.md (11 rows, every citation verified against the guard's own source) and corrected the AC's own text once: it is UX-DR7 not UX-DR47 (an earlier claimed second correction — a mislocated fonts-file reference — was checked and WITHDRAWN; AC 21 names no file for any entry). THEN the same-day three-layer review: ~40 findings -> 14 patches (headlines: the AC 13 shadowing tests were vacuous, AC 9's "one implementation" was two, nothing tied a nested card to its entry), 8 more ledgered, 1 decision for Brad (the undocumented 503 database_not_initialized -> c3-9). Suites 1798 -> 1829 Python (post-review) / 549 frontend UNCHANGED (this story ships no frontend behaviour); nine gates green incl. mypy --platform win32; BUNDLE + MIRROR RE-MEASURED BYTE-IDENTICAL as predicted. 12 deferred entries with named homes — 4 from the story (the list_decks over-fetch -> c10-3; the created_at tie -> unowned; never-fetched-by-a-browser -> c4-2; the openapi gate's blindness to meaning -> c3-2) plus 8 from the review — 19 landmines, 25 ACs, 5 open questions. First production route in src/. Headline decision (Q1): the Deck->DeckSummary/DeckDetail count projection moves DOWN from src/mcp_server/tools/deck_management.py into src/data/schemas/deck.py so both shells share one implementation (AD-1); model_validate silently defaults the counts to 0, so AC 3 asserts non-zero counts on the wire. Adds NO error token (deck_not_found already ships; card_not_found is c3-2's under retro R1). Ships no frontend: c4-1 owns the fetch/store, c4-2 the bootstrap, c3-9 the transition
  c3-2-card-detail-endpoint: done  # ROUND-2 REVIEWED -> done 2026-07-31: a second full-branch three-layer pass over PR #30's tip. 11 findings survived triage (6 dismissed): 8 patches applied same-day (headlines: the 503-outranks-400 retry trap promoted from the truncated Args: into a wire-visible Warning: by Brad's ruling — c4-1's fetch author now reads it in the JSDoc; the third ungated "Unknown card" quotation in contracts.py gained a Python-side label-pairing gate against EXPERIENCE.md; the family regexes widened for digit/underscore headers + dotted/plus-signed Sphinx roles, each probed; the vacuous two-literal 404-distinctness assert replaced with a real over-the-table claim; unknown-card-copy.test.ts hardened with an EOF truncation anchor + trimEnd + `] as const`-terminated body read, declared in the README blind-spot table), 2 new decisions ruled (Warning: promotion; card_faces stays untyped — ledgered, the first face consumer c3-5/c4-3 ships a typed CardFace WITH regenerated types in one commit), 2 defers ledgered (the GET-with-413 contract noise; the twice-written image-discriminator prose -> c3-5). Stowaway: states.ts's round-1 EveryPlaceholderIsAReal was never prettier-formatted (format:check red at the tip) — reformatted. Re-gated: Python 1848/-m not integration + the new gate, frontend 558, tsc -b, ruff/format/mypy, schema+types regenerated, mirror rebuilt. Previously: REVIEWED + PR #30 raised 2026-07-31. IMPLEMENTED off b0fd39b — the route is four lines exactly as contexted (CardRepository.get_by_id already returns the Card the AC asks for), and the story is everything around it: the FIRST extension of a closed set since c1-4, paid under C2 retro R1 ("c3-2 does not merge with the token alone"). All 5 open questions "as proposed" (12 of 12 running). SHIPPED: ErrorReason 6 -> 7 with all seven ripple sites in ONE commit, and card_not_found's UI destination beside it — Q3's typed classification in states.ts (PLACEHOLDER_FOR_REASON holding a destination SLUG, NO_UI_RESPONSE, and three type-level asserts making the THIRD meaning of `null` a compile error if unclassified), plus ui/tests/unknown-card-copy.test.ts asserting the label "Unknown card" against EXPERIENCE.md READ FROM DISK. The copy string itself is deliberately NOT in states.ts: it is prose, and copy-rules.test.ts's COPY_MODULES already homes it on c4-3. Q2 shipped a strict lowercase-only Path(pattern=...) — uuid.UUID was rejected because it NORMALISES braced/urn/32-hex/uppercase and would turn a malformed id into a FOUND card. Q4 ships NO price field (23 columns measured, none a price); Q5 kept the Attributes:-as-truncation-marker convention and stated its load-bearing-ness in src/data/schemas/card.py's MODULE docstring, and re-keyed the wire-prose gate from three literal markers onto THREE FAMILIES (Sphinx role markup; any line-anchored Google section header with Note:/Warning: as a declared two-member ALLOWLIST instead of a twelve-member ban list; doctest prompts), each with a non-vacuity test. FOUR FINDINGS, THREE OF THEM CORRECTIONS TO ASSUMPTIONS — TWO OF THEM MINE: (1) I asserted a malformed id is 400 even with no database; MEASURED FALSE — FastAPI solves dependencies before raising RequestValidationError, so 503 database_not_initialized WINS. The assertion was wrong, not the code; both outcomes now pinned, and ledgered for c3-9/c4-1 because a UI that treats 503 as "retry quietly" will retry a request that can never succeed. (2) A ui/tests file CANNOT import states.ts: tsconfig.node.json is nodenext (extensions required) and tsconfig.app.json is bundler (extensions forbidden), so the import made states.ts's own extensionless imports TS2835 and CASCADED into all three type asserts collapsing to `false` — errors naming the asserts, not the import. npm test stayed GREEN throughout (tsc-only) and `tsc -b` CACHED a clean result; only `npx tsc -b --force` surfaced it. Fixed with a source read + the runtime pin in the app-project test; ledgered Medium with three candidate proper fixes. (3) The story's landmine 13 claims ZERO grep hits for `price`; measured ONE (a forward-looking StatChip.css comment) — conclusion unaffected, number wrong. (4) A THIRD structural pin was supposed to go red and the story named only two: test_routes_decks.py's component-name set. FIVE MUTATION PROBES, ALL FIVE CAUGHT, each verified on disk and reverted: (a) router unregistered -> 39 failed incl. both status-AND-body shadowing tests; (b) card_not_found -> deck_not_found at the raise site -> 5 failed incl. the test written for it (both tokens are 404, so only the BODY separates them); (c) pattern -> `.+` -> 15 failed, incl. the drift gate independently, because the published pattern IS part of the wire contract; (d) a STAGED `type Card` plant -> the wire-contract ban grew to cover Card with NO edit to its mechanism; (e) the token reclassified into NO_UI_RESPONSE -> the new source-read pairing test fired (added because a regex assertion never seen to fail is not evidence). Also reproduced c2-9's probe 4 deliberately: FOUR typecheck-only failures under a fully green npm test. Suites 1836 -> 1888 Python / 549 -> 558 frontend; ten gates green incl. mypy --platform win32 and a FORCED tsc; openapi 3 -> 4 paths, 6 -> 7 schemas, both generated files committed together; SPA bundle + plugin mirror RE-MEASURED byte-identical (all 5 files) as predicted. 8 new deferred entries with named homes (prices; the 503/400 precedence -> c3-9; untyped card_faces -> c4-6; the 79 no-image cards as the placeholder's first measured population -> c4-3; the tsconfig cross-project trap; the unread classification -> c4-3/c3-9) plus BOTH c3-2-homed entries resolved. Also raised the long-standing list_decks tie-order flake to Medium: it FIRED once during this story (fourth confirmation across four stories), is unrelated to this code, and the deferral now costs more than the two-line fix. with 20 landmines, 27 ACs, 5 open questions. The route is four lines (CardRepository.get_by_id already returns the exact Card the AC asks for — no projection to move, contrast c3-1's landmine 10); what MAKES the story is that it is the first since c1-4 to EXTEND A CLOSED SET. ErrorReason 6 -> 7 ripples into seven places across two languages: contracts.py's Literal + its c3-2 prediction + ErrorResponse's per-token glass bullet list, STATUS_BY_REASON (404), test_errors.py's closed-set pin, ui/src/api/schema.test.ts's seven-token expectTypeOf, and states.ts's PANEL_FOR_REASON satisfies-clause — the last two fail under `tsc` ONLY, with `npm test` green (c2-9's probe 4 coming true). C2 retro R1 is the governing ruling: c3-2 does not merge with the token alone. TWO FINDINGS AT CONTEXT TIME. (1) R1's copy row ALREADY EXISTS (EXPERIENCE.md:69, "Unknown card" + truncated ID) and the c2-9 verbatim gate DELIBERATELY CANNOT SEE IT — copy.test.ts selects rows writing both a quoted Headline: and Body:, and its own docstring names this row as one of three that exclude themselves. So R1 cannot be satisfied with a STATE_COPY entry (StateKey is the panel vocabulary; EveryPanelHasASource would then demand a source for a panel nobody renders), and card_not_found's `null` in PANEL_FOR_REASON is a THIRD meaning — a named non-panel destination (c4-3's placeholder), not the "nothing to do" of invalid_request/payload_too_large. Q3 proposes a typed+gated distinction plus an EXPERIENCE.md-read-from-disk label assertion. (2) THERE ARE NO PRICE FIELDS ANYWHERE and never have been — no column, no field, no importer path, zero grep hits across src/tests/ui/scripts, and the 2026-07-11 PRD recon recorded it ("ABSENT: ... prices"). FR-17's "prices if present in local data" is never satisfied, so the epic's price AC is satisfied BY ABSENCE; Q4 proposes shipping no price field rather than a permanently-null wire branch. NINE COUNTS MEASURED on the real 38,261-row DB: all ids are canonical lowercase UUIDs (0 exceptions, so a 400 on a malformed id is decidable — but uuid.UUID as a path type normalises braced/urn/32-hex/uppercase and would turn malformed into FOUND, hence Q2's canonical-regex Path(pattern=...)); image_uris is JSON-null for 2,857 cards, 2,778 of which carry per-face image_uris instead, ZERO carry both, and 79 have no image anywhere; card_faces is 2 faces x3,222, 3 x2, 5 x1. Also homed here by name in deferred-work.md: the "openapi.json gate cannot see meaning" question and the Attributes:-as-truncation-marker convention (Q5 proposes taking both, shipping only the statically decidable half of the gate). Inherits c3-1's hard lessons: plugin/** is NOT "not touched" (CI drift gate), test_spa.py:305's hand-synchronised router list names c3-2 first, and the not-shadowed-by-SPA test must assert status AND body (c3-1 review R1: the content-type-only version passed with the router deleted).
  c3-3-format-check-endpoint-over-the-existing-validators: done  # ROUND-2 REVIEWED -> done 2026-08-01: second-model full-branch three-layer pass over PR #31 (core scope; plugin/ mirror + generated files excluded by Brad's standing preference). 22 raw findings -> 2 decisions ruled + 12 patches applied same-day, 1 defer ledgered, 5 dismissed with reasons. All three layers agree THE CODE HELD: route, projection and Q2 split sound; the auditor found every spec deviation already booked in the record ("conforms with five documented deviations, none unbooked") and independently re-verified schema/prose-gate/mirror. The findings clustered where this project gets burned: (1) THE SKILL FILE'S PROSE BEYOND THE TABLE ROW round 1 fixed — format-legality SKILL.md still taught the pre-c3-3 unknown_format diagnostic ("every card flagged, basics the giveaway" — a tell that can NO LONGER FIRE) in SIX places incl. two the hunters' own line lists missed, plus two worked transcripts quoting the retired "{format} requires at least 60" wording, plus "almost all the Vintage list" contradicted by the branch's own measurement (51 of 89); all rewritten, mirror rebuilt. Round 1's lesson ("the skill is an ungated ripple site") stopped at the table instead of the whole file — sweep the WHOLE document, not the section the diff touched. (2) GUARDS THAT ENUMERATE WHERE THEY SHOULD BAN THE FAMILY, third consecutive story: find_rule_violations missed whole-package imports (`import src.logic` reaches the validator by plain attribute chain — now any ancestor-package import flags) and format-name pairs split across nested containers / dict VALUES (now counted over the whole subtree); _is_ref_rooted's NEW union arm enumerated its refusals (object-shape, then type/items) so `required`/`enum`/`if`+`then` beside anyOf walked through — now allowlist-stance like the $ref arm beside it (round 1 had fixed the array arm the same way; the repair's own repair repeated the disease). 4 new firing + 3 silent probes;