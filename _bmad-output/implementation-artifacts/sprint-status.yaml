hich with a banned card would have found NO format_legality violation and reported the deck legal-except-size. AC 15 said "every ripple site is worked in the same commit" and the story's own enumeration of ripple sites DID NOT INCLUDE THE SKILL; nothing pins skill prose against the tool's vocabulary. Fixed + plugin/skills rebuilt; also added unknown_format, which that enumeration was ALREADY missing before this story. HEADLINE CORRECTNESS FINDING: is_legal is false for a formatless deck while EVERY ROW IS A PASS OR AN ADVISORY and not one is a violation (unknown_format is a violation to the validator but feeds no row), so a panel rendering is_legal as its verdict contradicts its own rows. Behaviour is right (it mirrors the validator so panel and agent cannot disagree); the DOCUMENTATION was the defect — the explanation sat in an Attributes: block, which the schema builder truncates before the wire. Promoted to a Warning:, one of the two headers main.py preserves, so c4-1's fetch author reads it in the JSDoc — c3-2's 503-retry-trap precedent applied a second time, verified in types.d.ts. THE GUARD I WROTE WAS THEATRE AND WAS MEASURED TO BE: the adversarial layer ran TWELVE plants through find_rule_violations and ALL TWELVE returned [], including a seven-line composite reimplementing the size rule, the singleton rule, the format set AND the legality read at once. Every family was keyed on the syntax my own firing tests happened to use — the guard's only proven property was that it caught its own four examples. Third time this theme has landed (c2-3's "every regex/list guard had an unprobed evasion", c3-2's "a guard that could not fail for its stated reason"). Rewritten to key on the NAME and the VALUE rather than the syntax, plus a fifth family for .quantity (AC 5 names "any copy counting" and I had none); re-probed 11/11 evasions CAUGHT, 0/6 false positives. TWO FALSE GREENS I INTRODUCED into _is_ref_rooted — the Q5 repair RE-OPENED a hole c3-1's review had closed: the union arm runs BEFORE the array arm and returned unconditionally, so a decorative anyOf sibling smuggled an inline envelope past the array guard; and {"anyOf":[{"type":"null"}]} returned True, rooted in zero refs, because all() over a null-only list is vacuously true — I had added the empty-anyOf case specifically to avoid that vacuity and left the one-branch case, the same hole shifted by one element. Plus a false RED ({"type":["null"]}, the legal 3.1 spelling). SERVER-AUTHORED PROSE THAT WAS FALSE RATHER THAN AWKWARD: the size row read "{format} requires at least 60" but _MIN_MAINBOARD is applied REGARDLESS of format (D-1.6b) — a gap with no format, a contradiction with an unrecognised one ("'potato' is not a recognized format" beside "potato requires at least 60"), and SIMPLY FALSE FOR COMMANDER, stated affirmatively beside is_legal: true on a panel a person reads. Three findings, one root cause; the structural rows now name the limit and never the format, and the same repair was applied to validate_deck's own violation detail so the agent surface stops saying it too. That also deleted the _SINGLETON_FORMATS read that made format_check's "reimplements no rule" docstring untrue. Smaller: the advisory arm gained `and not by_check[name]` so a violation on an unanswerable row can never be swallowed; _summarise now SORTS on card name because deck_cards order is documented as not meaningful, so "(+N more)" was headlining a UUID-sort accident (pinned by a test that reverses the entries and demands the same sentence); the route docstring's "the two surfaces can never disagree" is FALSE as written (the MCP tool takes format as a parameter defaulting to "standard") and now says the rules are shared while the inputs need not be; _SINGLETON_FORMATS <= _KNOWN_FORMATS pinned (load-bearing, held only by coincidence); AC 22 row 5's SECOND cited location restated (I had missed it); and ui/README.md's blind-spot row rewritten after the review found it UNDER-DECLARED ITS OWN GUARD'S HOLES — that section's rule is "a declared blind spot is still a claim". TWO RECORD DEFECTS the auditor caught: deps.py edited outside the declared file list with no deviation entry (now booked, with two others), and the test_spa.py router-list correction APPENDED rather than applied to the wrong list itself (now corrected in place). Suites 1987 -> 2032 Python (+139 over the 1893 baseline) / frontend 558 unchanged; all FOURTEEN gates re-run green from the same tree incl. both drift gates proven byte-reproducible and the bundle + mirror byte-identical to baseline. Flake named not absorbed: the list_decks tie-order flake fired in the auditor's independent run — FIFTH confirmation across five stories, already ledgered Medium. Previously — IMPLEMENTED 2026-08-01 off 2a787ac — the route is six lines; the story was the gap between UX-DR21's SIX checks and a validator producing FOUR that reports only failures. All 5 questions "as proposed" (13 of 13 running), Q5 PARTIAL — Brad took the _is_ref_rooted repair and declined the ui/README.md re-anchoring, which was re-homed. SHIPPED: format_check() in src/logic/deck_validator.py per Q1 (the projection moves DOWN, c3-1's precedent) + a banned_card split inside validate_deck itself per Q2 + Q3's permanently-advisory rotation row + Q4's unknown_format keying with ONE response shape always. Two new wire shapes, FormatCheckReport and FormatCheckRow — the FIRST components in the schema described by src/logic rather than src/data. No new reason token, no new router, no build_app() edit, no new dependency. FIVE FINDINGS, TWO OF THEM CORRECTIONS TO THE STORY'S OWN TEXT. (1) AC 15's central prediction is FALSE: extending DeckViolation.rule was supposed to redden six named assertion sites across three test files ("a red there is EXPECTED") — measured ZERO reds, ZERO test-file edits, 103 passed untouched, because NO TEST ANYWHERE seeds legality == "banned" (every format_legality fixture uses a missing key or None, both of which still route to format_legality). The ripple landed entirely on four DOCSTRINGS; coverage for the new rule was ADDED, not repaired. The story measured "zero banned cards in the deck table" and did not extend the same reasoning to fixtures already in the tree. (2) A structural pin went red that the story did not name, and it is c3-2's Debug Log 3 REPEATING: the story named test_routes_decks.py's component set and said "there is no excuse for finding it during a probe" — the one that failed was test_routes_cards.py's. Two hand-synchronised copies, story text tracks one; both updated with comments restated, ledgered with a fix shape, homed on c3-4 before it inherits the same surprise a third time. (3) Landmine 7 MEASURED and it corrects a standing deferred-work entry: test_spa.py 56 passed with NO edit — the router-list tax falls on adding a ROUTER, not a ROUTE, so the entry naming c3-3 among the stories owing a line is wrong and is corrected in place. (4) I truncated src/logic/deck_validator.py to 0 bytes mid-probe (a PowerShell non-terminating MethodException left $t2 null and Set-Content wrote it); caught immediately, restored from a backup taken seconds earlier, verified byte-identical by SHA-256, remaining probes applied with the editor instead. No committed file affected — recorded rather than quietly fixed. (5) The wire-prose gate found NOTHING and that was checked not assumed: 0 hits across all three families plus 0 occurrences of seven literal markers incl. `validate_deck` AS AN MCP TOOL NAME, which mattered because this is the first story to put a src/logic model on the wire. FOUR MUTATION PROBES, ALL FOUR CAUGHT, each verified on disk and reverted (both mutated files re-hashed identical to their pre-probe backups): (a) route unregistered -> 27 failed incl. TestNotShadowedBySpa, c3-1's R1 defect in this story's shape; (b) get_deck_with_cards -> get_deck -> 9 failed, headline `assert 0 == 60` — the route answered 200 with a plausible report about a 0-card deck and NO