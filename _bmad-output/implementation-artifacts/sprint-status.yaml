LOAD-BEARING AND THE MEASUREMENT INVERTED ITS ALTERNATIVE'S PREMISE: the rejected option argued "a 124 KB read from a local SSD is sub-millisecond"; measured here the READ is 4.97 ms (11x the 0.46 ms write), so 99 warm tiles inline would block the loop ~0.49 s — TWICE NFR-05's whole 250 ms push budget, from the path the cache exists to make fast. Q3's no-fsync ruling is carried by both its arguments: fsync measured 2.909 ms vs the whole write's 0.460 ms, so it did NOT come in under the ~1 ms the recommendation hedged against. gen:api produced NO DIFF (7 paths / 12 components), the SECOND measured behaviour-only story — enough to state the rule rather than the observation, which dump_openapi.py now does with c3-8 named next. SIX PROBES, each verified on disk and reverted by SHA-256, and three of them earned their keep: (c) the temp+replace collapsed into a direct open PASSED EVERY FUNCTIONAL AND CM-2 TEST and was caught only by the atomicity tests and the new one-write-site scan — the probe that justifies AC 5's gate existing; (f) the cache checked INSIDE pacer.slot() was caught by exactly ONE test of 911, the injected-clock one (197 spacing intervals where 98 are correct), which is why AC 6 measures the clock and not the bytes; (d) FOUND A REAL GAP IN MY OWN COVERAGE — the size-key extension mutation fired only 2 unit tests and NOTHING at the route level, so the assertion that mattered most (what the client is TOLD the bytes are) was missing; added the disk pairing and a route test proving a png-size Sparkspitter serves image/jpeg warm, and the probe then fired 4. FIVE DEBUG-LOG FINDINGS incl. TWO CORRECTIONS TO THE STORY'S OWN TEXT: TestTheBurstDoesNotOutlastTheConnectionPool drove ONE id 99 times while its own docstring called it "99 distinct" — invisible until a cache existed, then 3 recorded fetches plus a live PermissionError from two writers racing os.replace; read as CM-2 working (identical URLs, all 99 responses 200), and the fixture repaired to what it always claimed. Also: `git checkout` mid-probe DISCARDED uncommitted work on cards.py, caught by the pre/post hash check that exists for exactly that, reapplied and re-verified byte-identical, and every later probe reverted from a file backup. AC 24's runtime claim CANNOT be made honestly on this machine and saying so is the finding: three consecutive runs of identical code spread 49 s (118.40 / 119.12 / 167.56 vs a single 126.10 baseline sample); an intermediate 143.36 s reading was attributed to the cache's disk I/O and THAT ATTRIBUTION IS WITHDRAWN — the targeted control is probe (b), 43.38 s without the cache write vs 43.02 s with it. test_import_boundary.py passes UNCHANGED with no exclusions (50 passed) — and the record states plainly that its green does NOT cover what this story built: that guard is about the DATABASE and explicitly permits file I/O, so the one test whose name promises the companion never writes stayed green while this story taught it to write ~12 MB per deck. Suites 2326 -> 2386 Python / frontend 568 UNCHANGED by design; twelve gates green incl. mypy --platform win32 and a FORCED tsc; SPA bundle + plugin mirror RE-MEASURED byte-identical on all ten files. Six c3-7-homed deferred entries closed or re-homed by name (incl. the conditionally-homed read_card cache-header entry — this story landed first, CORRECTED the docstring and left the headers on c4-1; and the two stall-able CDN fakes, consolidated into conftest.StallableUpstream, which revealed they had ALREADY DRIFTED) plus in-flight coalescing DECLINED AGAIN and re-homed on c3-8 with the reason CHANGED (c3-6 declined for not knowing the result's shape; c3-7 built that shape and declined because c3-8 needs the same structure for a different question). Nine new deferred entries with named homes (eviction + removal command -> c8-2 with a MEASURED 1,061-id / ~130 MB footprint; real-bytes profiling -> c10-3; the concurrent-replace race -> c3-8; three-mechanism images.py -> c3-8/retro; plus the runtime measurement-practice note). Next = Brad's Task 8 same-day three-layer review, then the PR into feat/companion-c3.  # CONTEXTED 2026-08-01 off 2927336 (PR #34, c3-6, merged) — the sharded, atomically written disk cache: the FIRST write path in a package whose defining guard is that it never writes, and the story that finally satisfies the epic's CM-2 AC. 15 landmines, 24 ACs, 6 open questions (4 genuine forks). Headlines: `test_import_boundary.py`'s write guard is about the DATABASE and explicitly permits file I/O (`file-flush-in-atomic-write`), so the one test whose name promises "the companion never writes" stays green while this story writes ~12 MB per deck — said out loud rather than implied; c3-6's blocking-wait scan (`_BLOCKING_MODULES` = threading/concurrent.futures/multiprocessing/subprocess + time.sleep) is structurally BLIND to a synchronous file read, so AD-11's "async throughout" can be satisfied by every test and contradicted by the code (Q2 rules it, and the guard has to be extended to see it); `_BANNED_IDENTIFIERS` loses EIGHT names and keeps two for c3-8, with all THREE pairings needing rework — the firing test plants `NamedTemporaryFile` and would silently become `set() == set()`; `<ext>` must come from the resolved URL or Content-Type, never the size key (re-measured: `png` resolves to `.jpg` on exactly 3 real cards out of 245,760 URLs, and only `.jpg`/`.png` exist); shards re-measured at 256/256 used, 107-218 cards each against a flat 38,261; and the three-cards-one-URL test at :490-515 is a PREDICTION that the id-based key is right, to be run rather than assumed.
  c3-8-distinguishable-failure-signalling-and-negative-caching: done  # IMPLEMENTED -> review 2026-08-02 off 3aef5d1 — the negative cache with backoff, the THIRD and last mechanism the spine draws inside app/images.py. All 9 open questions "as proposed" (19 of 19 running), and TWO of them went against the grain: Q5 KEPT the last _BANNED_IDENTIFIERS family as a PERMANENT RULING rather than retiring it with the story that owned it — the first family in this epic not removed by its owner, because functools.cache/lru_cache cannot express a TTL and cache_clear() cannot address ONE key, so they are still the wrong tool the day the mechanism ships; retiring them would have been the first removal in this epic that LOST coverage rather than replacing it, and the positive gate (TestExactlyOneNegativeCache) was added ON TOP instead. Q6 declined in-flight coalescing a THIRD time and recorded that c3-7's stated reason DID NOT SURVIVE CONTACT: a negative cache needs no in-flight state at all — c3-7 re-homed it here expecting a shared structure that turned out not to exist — re-homed on c6-4. SHIPPED: images.NegativeCache (base 30 s, x2 per consecutive failure, 300 s ceiling, 2,048-entry cap, pruned on insert, evicted by earliest expiry, cleared entirely on recovery), constructed ONCE in the lifespan beside Pacer and DiskCache with a negative_cache(app) accessor; the route checks it AFTER the disk read, BEFORE the wiring guard and OUTSIDE pacer.slot(), records through the module's FIRST try/except (narrow `except CompanionError` — CancelledError inherits BaseException so a bare `except Exception` would already miss it), and clears on every success. Plus Q4's consecutive-write-failure counter on DiskCache, closing the ledgered "~99 WARNINGs per cold paint forever" entry (5 consecutive failures disable WRITES only, announced once; reads keep working for NFR-06; one success resets; per-instance state). NO new reason token, NO new route, NO new dependency, NO build_* factory, NO _shut