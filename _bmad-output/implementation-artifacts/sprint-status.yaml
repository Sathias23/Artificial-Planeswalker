LOAD-BEARING AND THE MEASUREMENT INVERTED ITS ALTERNATIVE'S PREMISE: the rejected option argued "a 124 KB read from a local SSD is sub-millisecond"; measured here the READ is 4.97 ms (11x the 0.46 ms write), so 99 warm tiles inline would block the loop ~0.49 s — TWICE NFR-05's whole 250 ms push budget, from the path the cache exists to make fast. Q3's no-fsync ruling is carried by both its arguments: fsync measured 2.909 ms vs the whole write's 0.460 ms, so it did NOT come in under the ~1 ms the recommendation hedged against. gen:api produced NO DIFF (7 paths / 12 components), the SECOND measured behaviour-only story — enough to state the rule rather than the observation, which dump_openapi.py now does with c3-8 named next. SIX PROBES, each verified on disk and reverted by SHA-256, and three of them earned their keep: (c) the temp+replace collapsed into a direct open PASSED EVERY FUNCTIONAL AND CM-2 TEST and was caught only by the atomicity tests and the new one-write-site scan — the probe that justifies AC 5's gate existing; (f) the cache checked INSIDE pacer.slot() was caught by exactly ONE test of 911, the injected-clock one (197 spacing intervals where 98 are correct), which is why AC 6 measures the clock and not the bytes; (d) FOUND A REAL GAP IN MY OWN COVERAGE — the size-key extension mutation fired only 2 unit tests and NOTHING at the route level, so the assertion that mattered most (what the client is TOLD the bytes are) was missing; added the disk pairing and a route test proving a png-size Sparkspitter serves image/jpeg warm, and the probe then fired 4. FIVE DEBUG-LOG FINDINGS incl. TWO CORRECTIONS TO THE STORY'S OWN TEXT: TestTheBurstDoesNotOutlastTheConnectionPool drove ONE id 99 times while its own docstring called it "99 distinct" — invisible until a cache existed, then 3 recorded fetches plus a live PermissionError from two writers racing os.replace; read as CM-2 working (identical URLs, all 99 responses 200), and the fixture repaired to what it always claimed. Also: `git checkout` mid-probe DISCARDED uncommitted work on cards.py, caught by the pre/post hash check that exists for exactly that, reapplied and re-verified byte-identical, and every later probe reverted from a file backup. AC 24's runtime claim CANNOT be made honestly on this machine and saying so is the finding: three consecutive runs of identical code spread 49 s (118.40 / 119.12 / 167.56 vs a single 126.10 baseline sample); an intermediate 143.36 s reading was attributed to the cache's disk I/O and THAT ATTRIBUTION IS WITHDRAWN — the targeted control is probe (b), 43.38 s without the cache write vs 43.02 s with it. test_import_boundary.py passes UNCHANGED with no exclusions (50 passed) — and the record states plainly that its green does NOT cover what this story built: that guard is about the DATABASE and explicitly permits file I/O, so the one test whose name promises the companion never writes stayed green while this story taught it to write ~12 MB per deck. Suites 2326 -> 2386 Python / frontend 568 UNCHANGED by design; twelve gates green incl. mypy --platform win32 and a FORCED tsc; SPA bundle + plugin mirror RE-MEASURED byte-identical on all ten files. Six c3-7-homed deferred entries closed or re-homed by name (incl. the conditionally-homed read_card cache-header entry — this story landed first, CORRECTED the docstring and left the headers on c4-1; and the two stall-able CDN fakes, consolidated into conftest.StallableUpstream, which revealed they had ALREADY DRIFTED) plus in-flight coalescing DECLINED AGAIN and re-homed on c3-8 with the reason CHANGED (c3-6 declined for not knowing the result's shape; c3-7 built that shape and declined because c3-8 needs the same structure for a different question). Nine new deferred entries with named homes (eviction + removal command -> c8-2 with a MEASURED 1,061-id / ~130 MB footprint; real-bytes profiling -> c10-3; the concurrent-replace race -> c3-8; three-mechanism images.py -> c3-8/retro; plus the runtime measurement-practice note). Next = Brad's Task 8 same-day three-layer review, then the PR into feat/companion-c3.  # CONTEXTED 2026-08-01 off 2927336 (PR #34, c3-6, merged) — the sharded, atomically written disk cache: the FIRST write path in a package whose defining guard is that it never writes, and the story that finally satisfies the epic's CM-2 AC. 15 landmines, 24 ACs, 6 open questions (4 genuine forks). Headlines: `test_import_boundary.py`'s write guard is about the DATABASE and explicitly permits file I/O (`file-flush-in-atomic-write`), so the one test whose name promises "the companion never writes" stays green while this story writes ~12 MB per deck — said out loud rather than implied; c3-6's blocking-wait scan (`_BLOCKING_MODULES` = threading/concurrent.futures/multiprocessing/subprocess + time.sleep) is structurally BLIND to a synchronous file read, so AD-11's "async throughout" can be satisfied by every test and contradicted by the code (Q2 rules it, and the guard has to be extended to see it); `_BANNED_IDENTIFIERS` loses EIGHT names and keeps two for c3-8, with all THREE pairings needing rework — the firing test plants `NamedTemporaryFile` and would silently become `set() == set()`; `<ext>` must come from the resolved URL or Content-Type, never the size key (re-measured: `png` resolves to `.jpg` on exactly 3 real cards out of 245,760 URLs, and only `.jpg`/`.png` exist); shards re-measured at 256/256 used, 107-218 cards each against a flat 38,261; and the three-cards-one-URL test at :490-515 is a PREDICTION that the id-based key is right, to be run rather than assumed.
  c3-8-distinguishable-failure-signalling-and-negative-caching: done  # IMPLEMENTED -> review 2026-08-02 off 3aef5d1 — the negative cache with backoff, the THIRD and last mechanism the spine draws inside app/images.py. All 9 open questions "as proposed" (19 of 19 running), and TWO of them went against the grain: Q5 KEPT the last _BANNED_IDENTIFIERS family as a PERMANENT RULING rather than retiring it with the story that owned it — the first family in this epic not removed by its owner, because functools.cache/lru_cache cannot express a TTL and cache_clear() cannot address ONE key, so they are still the wrong tool the day the mechanism ships; retiring them would have been the first removal in this epic that LOST coverage rather than replacing it, and the positive gate (TestExactlyOneNegativeCache) was added ON TOP instead. Q6 declined in-flight coalescing a THIRD time and recorded that c3-7's stated reason DID NOT SURVIVE CONTACT: a negative cache needs no in-flight state at all — c3-7 re-homed it here expecting a shared structure that turned out not to exist — re-homed on c6-4. SHIPPED: images.NegativeCache (base 30 s, x2 per consecutive failure, 300 s ceiling, 2,048-entry cap, pruned on insert, evicted by earliest expiry, cleared entirely on recovery), constructed ONCE in the lifespan beside Pacer and DiskCache with a negative_cache(app) accessor; the route checks it AFTER the disk read, BEFORE the wiring guard and OUTSIDE pacer.slot(), records through the module's FIRST try/except (narrow `except CompanionError` — CancelledError inherits BaseException so a bare `except Exception` would already miss it), and clears on every success. Plus Q4's consecutive-write-failure counter on DiskCache, closing the ledgered "~99 WARNINGs per cold paint forever" entry (5 consecutive failures disable WRITES only, announced once; reads keep working for NFR-06; one success resets; per-instance state). NO new reason token, NO new route, NO new dependency, NO build_* factory, NO _shutdown change — so test_app.py's startup asymmetry and test_deps.py's shutdown ordering both needed NO edit, a prediction confirmed by measurement. THE HEADLINE CORRECTION: AC 13's central prediction is FALSE and this is NOT the third behaviour-only story. 7 paths / 12 components unchanged — the structural half held perfectly — but `npm run gen:api` produced a REAL DIFF in both generated files, because AC 15's own REQUIRED edit to ErrorResponse's class docstring crosses the wire: a Pydantic model's class docstring is published IN ITS ENTIRETY (bullet list and all), while ErrorReason's attribute docstring TWELVE LINES AWAY in the same file is not published at all. Two docstrings, one file, opposite sides of the boundary — settled by RUNNING the generator exactly as dump_openapi.py insisted. The edit was KEPT rather than reverted on c3-2's and c3-3's precedent, so c4-4's tile author reads the 300 s recovery window in the generated JSDoc; both files regenerated and committed, dump_openapi.py rewritten with the corrected rule and c3-9 named next. PROBE (e) PASSED — a REAL HOLE in this story's own AC 7 coverage: deleting the route's clear-on-success left all 980 tests green, because my recovery test switched to size=large to dodge the warm disk cache and thereby stopped testing the recovered key at all. Repaired (disk cache disabled so the SAME key can succeed then fail) and re-probed: 1 failed. That is c3-7's probe (d) repeating — the probe catching its author rather than confirming them, second consecutive story. PROBE (f) — the negative check moved INSIDE pacer.slot() — was caught by exactly 2 tests of 981 and BOTH are the clock-measuring ones; every byte-identity, fetch-count and status assertion passed, which is the c3-5/c3-6/c3-7 shared review theme reproduced for a FOURTH story running and the whole argument for AC 4 measuring the injected clock. Probe (c), the expiry removed, passes every "no second fetch" test and is caught only by the boundary units and both recovery tests. Probe (d), the bound removed, is INVISIBLE to every route-level assertion. FIRST IMPLEMENTATION WAS WRONG AND THREE OF MY OWN UNIT TESTS CAUGHT IT: pruning at retry_after resets the escalation on every attempt, so a key against a permanently dead CDN cycles at the base 30 s forever and AC 6's schedule is unreachable in production — fixed with a retention horizon of retry_after + ceiling, a FIFTH number Q2 did not fix, derived rather than declared and ledgered. Also: the delay is stored rather than a failure count, because base * multiplier ** count raises OverflowError on a long-lived key. THE THREE VERIFICATION ACs were verified rather than inherited, and produced three genuinely new assertions: the two tokens asserted as a DISCRIMINATION from one test (they had only ever been proved in separate classes on separate fixtures); the "no substitute image" half asserted on the BYTES for no_image_data (it had only ever been status + .json(), and a status-only assertion passes with a grey rectangle in the body); and the pairing that separates "never fetched" from "fetched and remembered as failed". The structural pin the story NAMED IN ADVANCE did not fire — _LIMIT_LITERALS bans 60 anywhere under src/companion and Q2's schedule contains it, safe only because it is computed as previous x multiplier and never written as a literal tuple; five consecutive stories hit an unnamed pin and this is the first to name and avoid one. Corpus re-verified read-only, every number confirmed exactly (38,261 / 245,760 / 79 / 35,404 / 2,778 / 245,742 / 18 / ZERO outside the allow-list, which is all of Q3's evidence). Corrected the inherited baseline: 2392 passed, not the 2395 the story carried. Suites 2392 -> 2455 Python (+63) / companion 917 -> 980 / frontend 568 UNCHANGED by design; every gate green incl. mypy --platform win32 and a FORCED tsc; test_import_boundary.py 50 passed unchanged with NO exclusions; named-card-copy.test.ts 6 passed UNCHANGED, so EXPERIENCE.md's forward-dated backoff promise became true with no edit on either side; SPA bundle + plugin mirror RE-MEASURED byte-identical on all ten files. Nine inherited deferred entries closed or re-homed BY NAME (2 closed, 7 re-homed on c6-4/c8-2/the C3 retro) plus five new ones incl. the ~124 s first-paint exposure -> c10-3. images.py 1,307 -> 1,475 lines, recorded so the C3 retro inherits a number. Next = Brad's Task 9 same-day three-layer review, then the PR into feat/companion-c3. Previously — CONTEXTED 2026-08-02 off 3aef5d1 (PR #35, c3-7). Story file written; 9 open questions, 5 of them genuine forks. Headline finding: THREE of this story's five epic ACs already shipped at c3-5 (the distinguishable tokens, the never-fetch-for-no-image-data path, the placeholder data) - AC 1-3 are VERIFICATION ACs and are first for that reason; only the backoff and the retry are new. Q5 recommends AGAINST the pattern the last two stories set: functools.cache/lru_cache stay banned, because unlike Semaphore (c3-6) and mkdir (c3-7) they are still the wrong tool the day this ships (no TTL; cache_clear is all-or-nothing, so AC 7 clear-one-key-on-recovery is unimplementable on them) - the first family in this epic NOT removed by the story that owned it. Q6 declines in-flight coalescing a THIRD time and states why c3-7 reasoning does not survive contact (a negative cache needs no in-flight state; coalescing shares a 124 KB payload, a different mechanism). Measured read-only: 245,760 resolvable (id,size,face) keys = the memory bound; 79 image-less cards never reach the cache; ZERO stored URLs outside the allow-list, which is all of Q3 evidence; a cold paint against a dead CDN is ~124 s at min(1/0.1, 4/5.0) = 0.8 fetch/s and this story does NOT fix it - it fixes every paint after. Structural pin named in advance: _LIMIT_LITERALS = {60, 15} scans all of src/companion and 60 sits on Q2 proposed 30->60->120->240->300 schedule (safe only because base x2 never writes it as a literal). Nine deferred-work entries homed here, enumerated as an AC table.
  c3-9-fresh-install-guides-instead-of-erroring-and-comes-alive-on-its-own: done  # CODE REVIEW -> done 2026-08-02: three layers (Blind Hunter + Edge Case Hunter + Acceptance Auditor), 1 decision resolved (AC 11/25's browser halves — re-home to the epic manual-testing checklist ACCEPTED), 13 patches applied (headlines, each found by BOTH hunters independently: a generation counter so stop()/start() cannot apply a stale in-flight read or fork a second timer chain, with all schedule state reset on start(); AbortSignal.timeout(READ_TIMEOUT_MS=10 s) so a backend that accepts-and-never-answers becomes `unreachable` instead of freezing the loop forever; STALLED_MIN_REFUSALS=4 so wall-clock alone cannot escalate across a suspend/throttled tab — plus emission dedup to CHANGES, the identify() null-sentinel collision, the one-consumer rule written on useSystemState, posture.test.ts's stripper rebuilt as a string-aware walker, copy-tails' reader comment-stripped, the 200-with-non-JSON-body branch pinned, and three record repairs), 2 defers ledgered with homes (Q2's reset-on-flip cost -> c4-1; the stalled state's terminal forfeit of FR-22's self-transition -> C3 retro), 1 dismissed. Frontend 718 -> 730 (36 files); every gate re-run green (Python 2472/1 skipped, ruff, format, mypy both platforms, lint, format:check, tsc -b --force, build); bundle re-measured CHANGED again (1A23A616 -> ED89F647) with the plugin mirror diff -r identical. PR into feat/companion-c3 is the remaining step. Previously — IMPLEMENTED 2026-08-02 off 16976c5 — the epic's only frontend story, and the FIRST runtime behaviour in ui/src at all: one fetch (src/api/decks.ts, asserted to be the only network door in the SPA), one zustand slice (its first consumer since c2-1), one poller (2 s / x2 / 30 s ceiling) and one total wire->panel boundary that finally consumes PANEL_FOR_REASON and RETRIES_QUIETLY — the 318-line specification c2-9 wrote for this story and nothing had ever executed. All ten open questions ruled, nine as proposed; Q5 REFINED with a reason (a fetch REJECTION is not an absent token: clamping it to internal-error would have stopped the poll permanently on one blip, because RETRIES_QUIETLY says internal-error never retries — so a transport failure claims no state and retries, and the disconnected panel stays c5-6's per Q10). Q4 declared database_not_initialized on the database-backed includes: five operations changed and error_responses' documented COLLAPSE fired for the first time in seven stories. Q7 was MEASURED rather than argued and re-homed on c10-3 with numbers — the companion's engine has no WAL pragma, but WAL is a persistent FILE property set by src/search/connection.py, so an indexed database is WAL forever while a freshly created one measures `delete`; contended write latency 0.0080 s (wal) vs 0.2131 s max (delete) under four saturating readers, against a 5 s busy timeout and a poll that fires once every 2-30 s. Q9's markers proved a `#` comment above a wire model costs NO wire diff, dissolving c3-7's objection by measurement. TWO NEW FAMILY-KEYED GUARDS: posture.test.ts states presentation-only over the WHOLE component tree (a component may take a TYPE from anywhere and a VALUE from nowhere but its own tree and React) rather than as nine enumerated import lists, and pins the one network door; copy-tails.test.ts gates three of EXPERIENCE.md's four un-quoted tails against their TypeScript mirrors both ways. THE LIVE FRESH-INSTALL RUN HAPPENED (closes a c1-9 deferral nobody had ever run): empty data dir -> companion starts, plants no cards.db -> 503 database_not_initialized -> cards.db planted with the server RUNNING -> the next request answers 200 with real deck names, no restart. NOT DONE and stated as not done: nobody opened it in a browser — the transition and the four newly-reachable panels are gated in jsdom from ONE mount (probe (f) proves a remount-driven implementation fails) but the visual claim is made nowhere, and it is on the epic manual-testing checklist. Twelve inherited deferrals all dispositioned by name (10 closed, 2 partly), eight residue entries added, every one homed. Seven mutation probes, all caught — (d) produced the exact render crash AC 8 exists to prevent, and (g) confirmed the new guard's DECLARED split: the import door caught the evasive spelling, the identifier layer did not. Suites 2464 -> 2472 Python, 568 -> 718 frontend (31 -> 36 files). Bundle MEASURED CHANGED (FAEEEA47 -> 1A23A616, 25 -> 33 modules) with CSS and font byte-identical, and the plugin mirror diff -r identical.
