ion beyond the story, flagged for Brad): `4` is declared out of the limit family, joining `1` and the adjacent spellings 3/5/16 that were ALREADY declared out on precisely the ubiquity argument that applies to 4 — keeping it in was the order of discovery, not a stance. The copy limit stays covered by the .quantity family (enforcing it means counting copies), the residual hole (len(rows) > 4) is declared in ui/README.md, and both directions are probed. The alternative was renaming a ruled production constant to appease a guard, which is the obfuscation that guard's own docstring says to treat as a violation. TASK 0 PROVED Q6's PREMISE RATHER THAN INHERITING IT: the pool reports checkedout() == 1 while fetch_image is awaited and 0 after the response, and the pool is AsyncAdaptedQueuePool size 5 + overflow 10 = 15 with pool_timeout 30.0 — all four read off the live object. So deps.py's "c3-5 is the first consumer that goes on to do something AFTER the session closes" was simply FALSE and is corrected in place with the measurement and the arithmetic; a 99-request burst test pins the interaction so the story that slows the pacer past ~0.3s/tile finds the cliff named, including that sqlalchemy.exc.TimeoutError surfaces as 500 internal_error and NOT 503. TWO OF THE EPIC'S SIX ACs GOT OWNERS RATHER THAN PARAPHRASES: CM-2's "a repeat request makes no CDN request" is c3-7's (there is no cache here and a repeat request repeats the fetch — said in the module docstring, the record AND deferred-work.md), and the POST /agent/events half of the never-blocks-the-loop AC names an endpoint that does not exist until c5-1/c5-5, so it is c10-3's — /health is the stand-in with FIVE interleavings asserted by COUNT so a serialised loop fails it, and the substitution is recorded rather than passed off as the same test. Q4 put the queue wait OUTSIDE _FETCH_TOTAL_SECONDS (a request that has not started has no exchange to bound; inside it the 99th tile burns its 20s budget having sent no byte),