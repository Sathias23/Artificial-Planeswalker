  c3-1-deck-list-and-deck-detail-endpoints: done  # IMPLEMENTED 2026-07-31 off 02b2c45 — the FIRST production routes in src/, and mostly an exercise in consuming seams nineteen stories had already built rather than writing an endpoint. All 5 open questions "as proposed" (10th story running), plus a SIXTH forced by a contradiction inside the story itself: AC 18 says ui/src/App.tsx, ui/src/components/** and ui/src/api/schema.ts are untouchable, AC 20 rows 7+9 mandate comment repairs in exactly those files — and those comments say something FALSE ("c3-1 owns the fetch layer"; c4-1 does, as AC 18 itself states). Brad ruled comment-only repairs, AC 20 wins. SHIPPED: two routes in one 71-line module (bare JSON array for the list per AD-16, singular /api/deck/{id} for the detail — the spelling deps.py's own docstring got WRONG and which five artefacts agree on), and Q1's projection MOVED DOWN from src/mcp_server/tools/deck_management.py into src/data/schemas/deck.py as DeckSummary.from_deck/DeckDetail.from_deck, so both shells share one implementation (AD-1) — proven behaviour-preserving by the MCP suite passing with ZERO test-file edits. Adds NO error token, NO try/except, NO add_exception_handler: both 503 paths are inherited from c1-6 and proved THROUGH THE REAL ROUTES on both endpoints. FIVE FINDINGS, THREE OF THEM CORRECTIONS TO THE STORY'S OWN TEXT: (1) the spec lists plugin/** as "not touched, deliberately" but CI rebuilds it from src/ and fails on drift, and Task 1 edits two mirrored .py files — 8 mirror files rebuilt and committed, a guaranteed red build otherwise; (2) the AC 18/AC 20 contradiction above; (3) Sphinx role markup (:class:`X`) crosses the wire as JSDoc and AC 17's seven-string search list does not name it — caught in my OWN new docstring, confirmed absent from both already-shipped descriptions (double-backtick reST IS house style, role markup is not), fixed at the docstring and the scan re-keyed on the FAMILY per "ban the family, never enumerate members"; (4) two PRE-EXISTING structural pins broke and both were right to break — test_errors.py asserted every 200 body is exactly {"$ref"}, which a bare array is not, so it was replaced by a family-keyed _is_ref_rooted() (an array OF an inline envelope is still refused) with its own six-case firing/silent table; and test_spa.py's two schema tests hardcoded {"/health"}, repaired to their actual claims so they no longer rot when a story adds a route; (5) one forward-dated comment BECAME TRUE on its own (StatePanel's index-keys rationale — deck names really are non-unique user-authored strings) and was left unedited, which AC 20 permits. SIX MUTATION PROBES, ALL SIX CAUGHT, every mutation verified on disk before the verdict and every revert after: the load-bearing ones are probe 1 (the router silently unregistered — c2-9's headline defect in this story's shape, 19 failed), probe 2b (model_validate's silent-zero counts on the LIST route, the half probe 2 left untouched — "assert 0 == 3", which is landmine 10's exact failure mode), and probe 3+3b (a wrong path spelling is caught by the drift gate if you don't regenerate and by the path assertion if you do — neither test alone suffices). Probe 5 found a DECLARED LIMIT rather than a hole: a companion-local duplicate shape is invisible to AC 8 until something SERVES it. AC 16's anchors: initially withheld (edit-the-forbidden-file reasoning), then review R7 overturned that — the file already carries a HealthResponse anchor of exactly that kind — so two toContain anchors were added; the derived ban mechanism is untouched (AC 16's mechanism horn over its literal no-edit clause). AC 21's blind-spot map shipped in ui/README.md (11 rows, every citation verified against the guard's own source) and corrected the AC's own text once: it is UX-DR7 not UX-DR47 (an earlier claimed second correction — a mislocated fonts-file reference — was checked and WITHDRAWN; AC 21 names no file for any entry). THEN the same-day three-layer review: ~40 findings -> 14 patches (headlines: the AC 13 shadowing tests were vacuous, AC 9's "one implementation" was two, nothing tied a nested card to its entry), 8 more ledgered, 1 decision for Brad (the undocumented 503 database_not_initialized -> c3-9). Suites 1798 -> 1829 Python (post-review) / 549 frontend UNCHANGED (this story ships no frontend behaviour); nine gates green incl. mypy --platform win32; BUNDLE + MIRROR RE-MEASURED BYTE-IDENTICAL as predicted. 12 deferred entries with named homes — 4 from the story (the list_decks over-fetch -> c10-3; the created_at tie -> unowned; never-fetched-by-a-browser -> c4-2; the openapi gate's blindness to meaning -> c3-2) plus 8 from the review — 19 landmines, 25 ACs, 5 open questions. First production route in src/. Headline decision (Q1): the Deck->DeckSummary/DeckDetail count projection moves DOWN from src/mcp_server/tools/deck_management.py into src/data/schemas/deck.py so both shells share one implementation (AD-1); model_validate silently defaults the counts to 0, so AC 3 asserts non-zero counts on the wire. Adds NO error token (deck_not_found already ships; card_not_found is c3-2's under retro R1). Ships no frontend: c4-1 owns the fetch/store, c4-2 the bootstrap, c3-9 the transition
  c3-2-card-detail-endpoint: done  # ROUND-2 REVIEWED -> done 2026-07-31: a second full-branch three-layer pass over PR #30's tip. 11 findings survived triage (6 dismissed): 8 patches applied same-day (headlines: the 503-outranks-400 retry trap promoted from the truncated Args: into a wire-visible Warning: by Brad's ruling — c4-1's fetch author now reads it in the JSDoc; the third ungated "Unknown card" quotation in contracts.py gained a Python-side label-pairing gate against EXPERIENCE.md; the family regexes widened for digit/underscore headers + dotted/plus-signed Sphinx roles, each probed; the vacuous two-literal 404-distinctness assert replaced with a real over-the-table claim; unknown-card-copy.test.ts hardened with an EOF truncation anchor + trimEnd + `] as const`-terminated body read, declared in the README blind-spot table), 2 new decisions ruled (Warning: promotion; card_faces stays untyped — ledgered, the first face consumer c3-5/c4-3 ships a typed CardFace WITH regenerated types in one commit), 2 defers ledgered (the GET-with-413 contract noise; the twice-written image-discriminator prose -> c3-5). Stowaway: states.ts's round-1 EveryPlaceholderIsAReal was never prettier-formatted (format:check red at the tip) — reformatted. Re-gated: Python 1848/-m not integration + the new gate, frontend 558, tsc -b, ruff/format/mypy, schema+types regenerated, mirror rebuilt. Previously: REVIEWED + PR #30 raised 2026-07-31. IMPLEMENTED off b0fd39b — the route is four lines exactly as contexted (CardRepository.get_by_id already returns the Card the AC asks for), and the story is everything around it: the FIRST extension of a closed set since c1-4, paid under C2 retro R1 ("c3-2 does not merge with the token alone"). All 5 open questions "as proposed" (12 of 12 running). SHIPPED: ErrorReason 6 -> 7 with all seven ripple sites in ONE commit, and card_not_found's UI destination beside it — Q3's typed classification in states.ts (PLACEHOLDER_FOR_REASON holding a destination SLUG, NO_UI_RESPONSE, and three type-level asserts making the THIRD meaning of `null` a compile error if unclassified), plus ui/tests/unknown-card-copy.test.ts asserting the label "Unknown card" against EXPERIENCE.md READ FROM DISK. The copy string itself is deliberately NOT in states.ts: it is prose, and copy-rules.test.ts's COPY_MODULES already homes it on c4-3. Q2 shipped a strict lowercase-only Path(pattern=...) — uuid.UUID was rejected because it NORMALISES braced/urn/32-hex/uppercase and would turn a malformed id into a FOUND card. Q4 ships NO price field (23 columns measured, none a price); Q5 kept the Attributes:-as-truncation-marker convention and stated its load-bearing-ness in src/data/schemas/card.py's MODULE docstring, and re-keyed the wire-prose gate from three literal markers onto THREE FAMILIES (Sphinx role markup; any line-anchored Google section header with Note:/Warning: as a declared two-member ALLOWLIST instead of a twelve-member ban list; doctest prompts), each with a non-vacuity test. FOUR FINDINGS, THREE OF THEM CORRECTIONS TO ASSUMPTIONS — TWO OF THEM MINE: (1) I asserted a malformed id is 400 even with no database; MEASURED FALSE — FastAPI solves dependencies before raising RequestValidationError, so 503 database_not_initialized WINS. The assertion was wrong, not the code; both outcomes now pinned, and ledgered for c3-9/c4-1 because a UI that treats 503 as "retry quietly" will retry a request that can never succeed. (2) A ui/tests file CANNOT import states.ts: tsconfig.node.json is nodenext (extensions required) and tsconfig.app.json is bundler (extensions forbidden), so the import made states.ts's own extensionless imports TS2835 and CASCADED into all three type asserts collapsing to `false` — errors naming the asserts, not the import. npm test stayed GREEN throughout (tsc-only) and `tsc -b` CACHED a clean result; only `npx tsc -b --force` surfaced it. Fixed with a source read + the runtime pin in the app-project test; ledgered Medium with three candidate proper fixes. (3) The story's landmine 13 claims ZERO grep hits for `price`; measured ONE (a forward-looking StatChip.css comment) — conclusion unaffected, number wrong. (4) A THIRD structural pin was supposed to go red and the story named only two: test_routes_decks.py's component-name set. FIVE MUTATION PROBES, ALL FIVE CAUGHT, each verified on disk and reverted: (a) router unregistered -> 39 failed incl. both status-AND-body shadowing tests; (b) card_not_found -> deck_not_found at the raise site -> 5 failed incl. the test written for it (both tokens are 404, so only the BODY separates them); (c) pattern -> `.+` -> 15 failed, incl. the drift gate independently, because the published pattern IS part of the wire contract; (d) a STAGED `type Card` plant -> the wire-contract ban grew to cover Card with NO edit to its mechanism; (e) the token reclassified into NO_UI_RESPONSE -> the new source-read pairing test fired (added because a regex assertion never seen to fail is not evidence). Also reproduced c2-9's probe 4 deliberately: FOUR typecheck-only failures under a fully green npm test. Suites 1836 -> 1888 Python / 549 -> 558 frontend; ten gates green incl. mypy --platform win32 and a FORCED tsc; openapi 3 -> 4 paths, 6 -> 7 schemas, both generated files committed together; SPA bundle + plugin mirror RE-MEASURED byte-identical (all 5 files) as predicted. 8 new deferred entries with named homes (prices; the 503/400 precedence -> c3-9; untyped card_faces -> c4-6; the 79 no-image cards as the placeholder's first measured population -> c4-3; the tsconfig cross-project trap; the unread classification -> c4-3/c3-9) plus BOTH c3-2-homed entries resolved. Also raised the long-standing list_decks tie-order flake to Medium: it FIRED once during this story (fourth confirmation across four stories), is unrelated to this code, and the deferral now costs more than the two-line fix. with 20 landmines, 27 ACs, 5 open questions. The route is four lines (CardRepository.get_by_id already returns the exact Card the AC asks for — no projection to move, contrast c3-1's landmine 10); what MAKES the story is that it is the first since c1-4 to EXTEND A CLOSED SET. ErrorReason 6 -> 7 ripples into seven places across two languages: contracts.py's Literal + its c3-2 prediction + ErrorResponse's per-token glass bullet list, STATUS_BY_REASON (404), test_errors.py's closed-set pin, ui/src/api/schema.test.ts's seven-token expectTypeOf, and states.ts's PANEL_FOR_REASON satisfies-clause — the last two fail under `tsc` ONLY, with `npm test` green (c2-9's probe 4 coming true). C2 retro R1 is the governing ruling: c3-2 does not merge with the token alone. TWO FINDINGS AT CONTEXT TIME. (1) R1's copy row ALREADY EXISTS (EXPERIENCE.md:69, "Unknown card" + truncated ID) and the c2-9 verbatim gate DELIBERATELY CANNOT SEE IT — copy.test.ts selects rows writing both a quoted Headline: and Body:, and its own docstring names this row as one of three that exclude themselves. So R1 cannot be satisfied with a STATE_COPY entry (StateKey is the panel vocabulary; EveryPanelHasASource would then demand a source for a panel nobody renders), and card_not_found's `null` in PANEL_FOR_REASON is a THIRD meaning — a named non-panel destination (c4-3's placeholder), not the "nothing to do" of invalid_request/payload_too_large. Q3 proposes a typed+gated distinction plus an EXPERIENCE.md-read-from-disk label assertion. (2) THERE ARE NO PRICE FIELDS ANYWHERE and never have been — no column, no field, no importer path, zero grep hits across src/tests/ui/scripts, and the 2026-07-11 PRD recon recorded it ("ABSENT: ... prices"). FR-17's "prices if present in local data" is never satisfied, so the epic's price AC is satisfied BY ABSENCE; Q4 proposes shipping no price field rather than a permanently-null wire branch. NINE COUNTS MEASURED on the real 38,261-row DB: all ids are canonical lowercase UUIDs (0 exceptions, so a 400 on a malformed id is decidable — but uuid.UUID as a path type normalises braced/urn/32-hex/uppercase and would turn malformed into FOUND, hence Q2's canonical-regex Path(pattern=...)); image_uris is JSON-null for 2,857 cards, 2,778 of which carry per-face image_uris instead, ZERO carry both, and 79 have no image anywhere; card_faces is 2 faces x3,222, 3 x2, 5 x1. Also homed here by name in deferred-work.md: the "openapi.json gate cannot see meaning" question and the Attributes:-as-truncation-marker convention (Q5 proposes taking both, shipping only the statically decidable half of the gate). Inherits c3-1's hard lessons: plugin/** is NOT "not touched" (CI drift gate), test_spa.py:305's hand-synchronised router list names c3-2 first, and the not-shadowed-by-SPA test must assert status AND body (c3-1 review R1: the content-type-only version passed with the router deleted).
  c3-3-format-check-endpoint-over-the-existing-validators: review  # REVIEWED 2026-08-01 (three layers, same-day, before the PR — the six-times-confirmed round-1-5/5 cause): ~40 findings -> 18 PATCHES applied, 4 dismissed with reasons, 3 ledgered. THE FINDING I WOULD NOT HAVE FOUND ALONE: .claude/skills/format-legality/SKILL.md is a SHIPPED user-facing skill that ENUMERATES validate_deck's rule vocabulary, so Q2's banned_card made three of its statements false — including a playbook that routes format_legality to a "look up why" step, which with a banned card would have found NO format_legality violation and reported the deck legal-except-size. AC 15 said "every ripple site is worked in the same commit" and the story's own enumeration of ripple sites DID NOT INCLUDE THE SKILL; nothing pins skill prose against the tool's vocabulary. Fixed + plugin/skills rebuilt; also added unknown_format, which that enumeration was ALREADY missing before this story. HEADLINE CORRECTNESS FINDING: is_legal is false for a formatless deck while EVERY ROW IS A PASS OR AN ADVISORY and not one is a violation (unknown_format is a violation to the validator but feeds no row), so a panel rendering is_legal as its verdict contradicts its own rows. Behaviour is right (it mirrors the validator so panel and agent cannot disagree); the DOCUMENTATION was the defect — the explanation sat in an Attributes: block, which the schema builder truncates before the wire. Promoted to a Warning:, one of the two headers main.py preserves, so c4-1's fetch author reads it in the JSDoc — c3-2's 503-retry-trap precedent applied a second time, verified in types.d.ts. THE GUARD I WROTE WAS THEATRE AND WAS MEASURED TO BE: the adversarial layer ran TWELVE plants through find_rule_violations and ALL TWELVE returned [], including a seven-line composite reimplementing the size rule, the singleton rule, the format set AND the legality read at once. Every family was keyed on the syntax my own firing tests happened to use — the guard's only proven property was that it caught its own four examples. Third time this theme has landed (c2-3's "every regex/list guard had an unprobed evasion", c3-2's "a guard that could not fail for its stated reason"). Rewritten to key on the NAME and the VALUE rather than the syntax, plus a fifth family for .quantity (AC 5 names "any copy counting" and I had none); re-probed 11/11 evasions CAUGHT, 0/6 false positives. TWO FALSE GREENS I INTRODUCED into _is_ref_rooted — the Q5 repair RE-OPENED a hole c3-1's review had closed: the union arm runs BEFORE the array arm and returned unconditionally, so a decorative anyOf sibling smuggled an inline envelope past the array guard; and {"anyOf":[{"type":"null"}]} returned True, rooted in zero refs, because all() over a null-only list is vacuously true — I had added the empty-anyOf case specifically to avoid that vacuity and left the one-branch case, the same hole shifted by one element. Plus a false RED ({"type":["null"]}, the legal 3.1 spelling). SERVER-AUTHORED PROSE THAT WAS FALSE RATHER THAN AWKWARD: the size row read "{format} requires at least 60" but _MIN_MAINBOARD is applied REGARDLESS of format (D-1.6b) — a gap with no format, a contradiction with an unrecognised one ("'potato' is not a recognized format" beside "potato requires at least 60"), and SIMPLY FALSE FOR COMMANDER, stated affirmatively beside is_legal: true on a panel a person reads. Three findings, one root cause; the structural rows now name the limit and never the format, and the same repair was applied to validate_deck's own violation detail so the agent surface stops saying it too. That also deleted the _SINGLETON_FORMATS read that made format_check's "reimplements no rule" docstring untrue. Smaller: the advisory arm gained `and not by_check[name]` so a violation on an unanswerable row can never be swallowed; _summarise now SORTS on card name because deck_cards order is documented as not meaningful, so "(+N more)" was headlining a UUID-sort accident (pinned by a test that reverses the entries and demands the same sentence); the route docstring's "the two surfaces can never disagree" is FALSE as written (the MCP tool takes format as a parameter defaulting to "standard") and now says the rules are shared while the inputs need not be; _SINGLETON_FORMATS <= _KNOWN_FORMATS pinned (load-bearing, held only by coincidence); AC 22 row 5's SECOND cited location restated (I had missed it); and ui/README.md's blind-spot row rewritten after the review found it UNDER-DECLARED ITS OWN GUARD'S HOLES — that section's rule is "a declared blind spot is still a claim". TWO RECORD DEFECTS the auditor caught: deps.py edited outside the declared file list with no deviation entry (now booked, with two others), and the test_spa.py router-list correction APPENDED rather than applied to the wrong list itself (now corrected in place). Suites 1987 -> 2032 Python (+139 over the 1893 baseline) / frontend 558 unchanged; all FOURTEEN gates re-run green from the same tree incl. both drift gates proven byte-reproducible and the bundle + mirror byte-identical to baseline. Flake named not absorbed: the list_decks tie-order flake fired in the auditor's independent run — FIFTH confirmation across five stories, already ledgered Medium. Previously — IMPLEMENTED 2026-08-01 off 2a787ac — the route is six lines; the story was the gap between UX-DR21's SIX checks and a validator producing FOUR that reports only failures. All 5 questions "as proposed" (13 of 13 running), Q5 PARTIAL — Brad took the _is_ref_rooted repair and declined the ui/README.md re-anchoring, which was re-homed. SHIPPED: format_check() in src/logic/deck_validator.py per Q1 (the projection moves DOWN, c3-1's precedent) + a banned_card split inside validate_deck itself per Q2 + Q3's permanently-advisory rotation row + Q4's unknown_format keying with ONE response shape always. Two new wire shapes, FormatCheckReport and FormatCheckRow — the FIRST components in the schema described by src/logic rather than src/data. No new reason token, no new router, no build_app() edit, no new dependency. FIVE FINDINGS, TWO OF THEM CORRECTIONS TO THE STORY'S OWN TEXT. (1) AC 15's central prediction is FALSE: extending DeckViolation.rule was supposed to redden six named assertion sites across three test files ("a red there is EXPECTED") — measured ZERO reds, ZERO test-file edits, 103 passed untouched, because NO TEST ANYWHERE seeds legality == "banned" (every format_legality fixture uses a missing key or None, both of which still route to format_legality). The ripple landed entirely on four DOCSTRINGS; coverage for the new rule was ADDED, not repaired. The story measured "zero banned cards in the deck table" and did not extend the same reasoning to fixtures already in the tree. (2) A structural pin went red that the story did not name, and it is c3-2's Debug Log 3 REPEATING: the story named test_routes_decks.py's component set and said "there is no excuse for finding it during a probe" — the one that failed was test_routes_cards.py's. Two hand-synchronised copies, story text tracks one; both updated with comments restated, ledgered with a fix shape, homed on c3-4 before it inherits the same surprise a third time. (3) Landmine 7 MEASURED and it corrects a standing deferred-work entry: test_spa.py 56 passed with NO edit — the router-list tax falls on adding a ROUTER, not a ROUTE, so the entry naming c3-3 among the stories owing a line is wrong and is corrected in place. (4) I truncated src/logic/deck_validator.py to 0 bytes mid-probe (a PowerShell non-terminating MethodException left $t2 null and Set-Content wrote it); caught immediately, restored from a backup taken seconds earlier, verified byte-identical by SHA-256, remaining probes applied with the editor instead. No committed file affected — recorded rather than quietly fixed. (5) The wire-prose gate found NOTHING and that was checked not assumed: 0 hits across all three families plus 0 occurrences of seven literal markers incl. `validate_deck` AS AN MCP TOOL NAME, which mattered because this is the first story to put a src/logic model on the wire. FOUR MUTATION PROBES, ALL FOUR CAUGHT, each verified on disk and reverted (both mutated files re-hashed identical to their pre-probe backups): (a) route unregistered -> 27 failed incl. TestNotShadowedBySpa, c3-1's R1 defect in this story's shape; (b) get_deck_with_cards -> get_deck -> 9 failed, headline `assert 0 == 60` — the route answered 200 with a plausible report about a 0-card deck and NOTHING RAISED, landmine 3 reproduced exactly; (c) pass/violation inverted for the size row only -> 5 failed across BOTH layers incl. the non-vacuity pair AC 25 exists for; (d) a STAGED type plant -> caught by name with NO edit to the ban mechanism. THREE DECISIONS BEYOND THE STORY, each stated: format_recognized: bool so c4-10 branches on a boolean rather than prose (ledgered as declared-but-unread, delete it if c4-10 never reads it); a multi-violation row summarises as "<first> (+N more)" in src/logic, where the prose already lives; and the report carries the NORMALISED format, not the stored one (0 of 40 real decks differ today — ledgered anyway). AC 5's no-rule-in-the-shell gate is a pure AST function over src/companion banning FOUR FAMILIES (any .legalities read, any validator import outside a declared projection surface, any comparison against 60/15/4, any rebuilt format-name set) with 9 firing + 6 silent cases; `1` is deliberately OUTSIDE the family because `> 1`/`== 1` are ubiquitous — a DECLARED LIMIT, written into the docstring and ui/README.md's blind-spot map, not a hole found later. AC 19: every generated field is required and non-nullable — c3-1's ?-vs-| null asymmetry does NOT repeat, and the reason is structural (those came from Python-side defaults; nothing here declares one). Suites 1893 -> 1987 Python (+94) / frontend 558 UNCHANGED by design; schema 4 -> 5 paths, 7 -> 9 components, both generated files committed together and a full regeneration proven byte-identical; SPA bundle + plugin mirror RE-MEASURED byte-identical to baseline as predicted (6 mirrored .py files rebuilt). 7 new deferred entries with named homes (rotation's true cost; restricted-is-not-illegal; the 60-cards-always limit now visible to a HUMAN for the first time; the two-copy component pin -> c3-4; the declined README anchoring; format_recognized unread -> c4-10; normalised-vs-stored format) plus BOTH other c3-3-homed entries RESOLVED. Previously — CONTEXTED 2026-07-31 off 2a787ac (PR #30 merged the umbrella forward; the local branch was stale at b0fd39b) with 19 landmines, 27 ACs, 5 open questions — TWO of them genuine forks, the first story since c1-4 whose questions change what ships rather than where it lives. THE STORY IS A SPEC/VALIDATOR GAP, not an endpoint: src/logic/deck_validator.validate_deck already exists, is already Pydantic and is already what the validate_deck MCP tool applies, so AD-1 is nearly free — but UX-DR21 (EXPERIENCE.md:37, quoted verbatim) names SIX checks over a validator that produces FOUR, and it reports only what is WRONG while the panel wants a row per check including the ones that passed. Three gaps, all measured, none paperable-over in the route. (1) NO PASS ROWS — DeckValidationReport carries violations[] and nothing else, so something must project violations-plus-silence into rows; Q1 asks where, against c3-1's ruling that a projection moves DOWN into the shared core (proposed: src/logic beside the validator; contracts.py is a LEAF and may not import src.logic, and pass/advisory/violation is domain vocabulary — the positive/caution/negative TONE MAP is the UI half and stays in TS at c4-10). (2) BANNED IS NOT DISTINGUISHED — deck_validator.py:384 is `legalities.get(format) != "legal"`, so a banned card and an out-of-format card are one format_legality violation; measured 1,275 banned entries corpus-wide (10 in Standard) + 89 restricted, so the data supports the split, but deriving it IN THE ENDPOINT is the exact thing this story's own AC bans in the same sentence as a TypeScript reimplementation. Q2 proposes extending DeckViolation.rule in src/logic — a closed-set extension in the SHARED CORE, rippling the Literal, two docstrings, the MCP tool docstring and SIX named assertion sites across three test files (bigger than the route). restricted-is-legal-with-a-1-copy-limit is a real latent bug in the same branch: ledger, do not fix. (3) ROTATION EXPOSURE HAS NO DATA SOURCE AT ALL — c3-2's prices finding in a different column, and stronger, because this AC says the response must COVER rotation: PRAGMA table_info(cards) = 23 columns with NO released_at and NO set_type, there is NO sets table, and released_at IS read by aggregate.py:113-134 to pick the canonical printing and then DISCARDED. Q3 is the fork most worth overruling on — ship the row as `advisory` (satisfies the AC literally, makes the gap visible) vs ship five honest rows and ledger. Either way `advisory` has a population via Q4. MEASURED, DO NOT REDISCOVER: all 40 real decks validated against their own format = 35 legal / 5 not (min_deck_size x4, format_legality x1) with ZERO banned and ZERO restricted cards anywhere in the deck table — so Q2's split changes NO verdict on any real deck today and the banned row can ONLY be tested against a synthetic fixture (a test seeded from real data passes vacuously). decks.format is VARCHAR NOT NULL with 0 of 40 null-or-blank, create_deck(format: str) is required-with-no-emptiness-check, and Deck.format is nonetheless typed str | None — which IS the deferred entry homed here (Q4 proposes keying "no format to check against" on the validator's existing unknown_format outcome, resolving the entry as "the wire type is wider than the data, leave it", re-homed to c4-10; and ONE response shape always, never a union, so _is_ref_rooted cannot fire). NO NEW REASON TOKEN — deck_not_found ships since c3-1, so unlike c3-2 there is no closed-set extension on the wire and no retro ruling attached. FOUR THINGS THE SEAM ALREADY GIVES: get_deck_with_cards is the ONLY correct loader (get_deck yields lazy="noload" empty cards and a SILENT 0-card report that reads as a legitimate min_deck_size violation — c3-1's landmine 10 in a new costume, AC 4 pins non-zero counts); CardSummary CANNOT feed the validator (it omits legalities, so this route reads the repository's Deck, not DeckDetail); both 503s and the 404 arrive with DbSession + error_responses with no ceremony; and the route belongs on decks.router, which means build_app() needs NO edit and test_spa.py:305-307's hand-synchronised router list needs NO line — the one story that escapes that standing tax, to be MEASURED not assumed. Landmine 13 is the one nobody would have predicted: _MIN_MAINBOARD = 60 applies REGARDLESS of format (D-1.6b, deliberately documented), so this story publishes an existing src/logic limitation to a HUMAN for the first time — Brawl is genuinely 60 so the 20 brawl decks are fine, Commander would be told 60 is enough. State it; do not widen scope. Also recorded: the PRD mentions legality NOWHERE — this endpoint exists solely because EXPERIENCE.md made the panel P0, so UX-DR21 IS the requirement and a UX/validator disagreement is Brad's call, not a defect to route around. Q5 takes both items homed here by name (_is_ref_rooted's union blindness; ui/README.md's line-number-anchored blind-spot map -> marker strings + a resolves-test). Named in advance so it is not found during a probe: test_routes_decks.py:695's component-name pin reddens on any new schema (c3-2's Debug Log 3, "a third structural pin was supposed to go red and the story named only two"). Baseline to re-measure: ~Python 1893/1 skipped full, 1848 under -m "not integration", frontend 558 (29 files); schema 4 paths / 7 components.
