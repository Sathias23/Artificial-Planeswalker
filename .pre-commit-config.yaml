repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      # Run the linter with auto-fix
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: [--strict, --ignore-missing-imports]
        additional_dependencies:
          - fastapi>=0.139.2
          - pydantic>=2.12.0
          - sqlalchemy>=2.0.44
          - numpy>=2.0.0
          - mcp>=1.27.0
          - platformdirs>=4.0.0
          - uvicorn>=0.51.0
          # httpx ships py.typed, so without it here every httpx call in src/companion/client.py
          # would be silently `Any` in this isolated hook while `uv run mypy src/` checked it
          # properly — the hook would pass a file local mypy would reject.
          - httpx>=0.28.1
        files: ^src/

  # The maintainer's local machine path leaked into the tracked tree (fourteen process files and
  # one comment) before the process artifacts moved to the `process` branch. `pygrep` needs no
  # script: pre-commit greps every staged text file and fails on any match. The two documents that
  # describe the leak, and the story that specified this hook, quote the path on purpose.
  - repo: local
    hooks:
      - id: no-local-machine-paths
        name: no local machine paths
        language: pygrep
        entry: 'C:[\\/]+Users[\\/]+brads|c-{2}Users-brads'
        exclude: ^(docs/release-readiness-review\.md|_bmad-output/planning-artifacts/research/quality-audit-2026-09-03\.md|_bmad-output/specs/spec-quality-audit-p1/stories/1-metadata-bounds-clutter-process-move\.md)$

  # Keep the committed plugin/ tree (the marketplace `source`) in sync with src/. When a source
  # input changes, rebuild it; pre-commit then fails if plugin/ was modified, prompting a re-add.
  - repo: local
    hooks:
      # CI parity for the ui job's Prettier step: `npm run lint` does NOT include Prettier, so
      # without this a formatting slip reaches CI and the fix-up push burns a Greptile review
      # (PR #105). Same script and cwd as CI (`npm run format:check` inside ui/).
      - id: ui-prettier-check
        name: prettier --check (ui)
        entry: npm run format:check --prefix ui
        language: system
        pass_filenames: false
        files: ^ui/
      - id: build-plugin-sync
        name: rebuild plugin/ (keep marketplace source in sync with src/)
        entry: uv run python -m scripts.build_plugin
        language: system
        pass_filenames: false
        files: ^(src/|\.claude/skills/(magic-deckbuilding|mana-curve-analysis|synergy-discovery|format-legality|companion)/|pyproject\.toml|uv\.lock|README\.md|LICENSE|NOTICE|scripts/build_plugin\.py)
