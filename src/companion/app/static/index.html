<!doctype html>
<!--
  GENERATED OUTPUT — do not edit this file if you are reading it under
  src/companion/app/static/ (or plugin/server/src/companion/app/static/).

  Both of those trees are build artifacts, committed so a fresh install serves the UI with no
  Node toolchain (AD-13). Edit the source in ui/ and run `npm run build` from there; CI rebuilds
  the bundle and fails the build if the committed copy is stale.

  This notice lives in the Vite source template (ui/index.html) because nothing hand-written can
  survive inside the output directory — `emptyOutDir` wipes everything there except .git on
  every build.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      The font is discovered two stylesheet-parses deep (index.css -> fonts.css -> @font-face),
      so without this the browser cannot start fetching it until late. `href` names the SOURCE
      path and Vite rewrites it to the same content-hashed /assets/ URL the @font-face gets —
      hard-coding a hash here would be invalidated by the next build.

      `crossorigin` is REQUIRED even though this is same-origin: font fetches are always made in
      CORS mode, and a preload without it is a fetch in a different mode than the real request,
      so the browser downloads the file TWICE and the optimisation becomes a pessimisation.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/space-grotesk-latin-wght-normal-BhU9QXUp.woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artificial Planeswalker</title>
    <script type="module" crossorigin src="/assets/index-D-5ylWSq.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DvMkerW6.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
