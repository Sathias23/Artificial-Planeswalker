name: CI

# Quality gates for the public repo: mirrors the local pre-commit / CONTRIBUTING
# checks (ruff lint, ruff format, mypy --strict, pytest) on a Python 3.12/3.13 matrix,
# plus the frontend gate for ui/ (eslint + stylelint, prettier, tsc -b, vitest).
# Runs on pushes to master and on every pull request. No DB, model or secrets are
# required and pytest is scoped to "not integration"; the `frontend` job is the one
# exception to "no network" — it downloads ui/ dependencies from the npm registry.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let push-to-master runs finish so the
  # default branch always ends on a completed check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: lint · types · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src/

      # Both invocations are mandatory and neither is redundant. mypy type-checks only the
      # branch matching the target platform, and src/companion/app/singleton.py branches on
      # sys.platform with a genuinely different implementation per half (msvcrt vs fcntl).
      # This runner is ubuntu, so the bare run above IS the linux run; without the line
      # below the Windows half is checked by nobody and a Windows-only type error reaches
      # master green. Closes C1 retro action item 3.
      #
      # The epic text for story c2-1 asked for `--platform linux` here. That was written
      # from a Windows machine, where the bare run is the win32 run; on ubuntu it would be
      # a pure no-op and the retro's stated success criterion — "a deliberately
      # Windows-broken singleton.py fails CI" — would still not hold. The success criterion
      # wins. See the c2-1 Completion Notes.
      - name: Mypy (strict, opposite platform)
        run: uv run mypy src/ --platform win32

      - name: Pytest (excluding integration)
        run: uv run pytest -m "not integration"

      # The committed plugin/ tree is a generated build artifact (the marketplace `source`).
      # Rebuild it and fail if it drifts from src/ — i.e. someone changed src/skills/README/manifest
      # without re-running the build. The build writes LF on every OS, so this is platform-stable.
      - name: Plugin tree in sync with src/
        run: |
          uv run python -m scripts.build_plugin
          if [ -n "$(git status --porcelain -- plugin/)" ]; then
            echo "::error::plugin/ is stale — run 'uv run python -m scripts.build_plugin' and commit plugin/."
            git status --porcelain -- plugin/
            git --no-pager diff -- plugin/
            exit 1
          fi

  # Deliberately NOT folded into the `quality` matrix job: that job is a Python 3.12/3.13
  # matrix and would install Node twice for no reason. One job, no Node matrix (ruling B5) —
  # `node-version: 20` is the declared floor, i.e. the version nobody develops on and
  # therefore the one worth gating. Current Node is covered incidentally by local runs.
  frontend:
    name: lint · types · tests (ui, node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The floor declared by ui/package.json is >=20.19.0; setup-node resolves "20" to
          # the latest 20.x, which satisfies it. Raising this is an AC 2 decision, not a fix.
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm ci`, never `npm install`: it fails instead of silently updating when
      # package.json and the committed lockfile disagree.
      - name: Install dependencies (locked)
        run: npm ci

      # The four gates NFR-07 names. Each is a separate step so a failure names itself.
      - name: ESLint + stylelint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test
